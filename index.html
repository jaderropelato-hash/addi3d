<style>
:root{
  --navy:#0A121D;
  --navy-2:#111C2B;
  --navy-3:#1B2C42;
  --orange:#4C8FCB;
  --orange-dark:#2E6CA4;
  --paper:#F6F7F9;
  --paper-2:#FFFFFF;
  --line:#E4E7EC;
  --ink:#1C2733;
  --ink-soft:#5B6B7C;
  --ink-faint:#8C99A6;
  --green:#1C9C6B;
  --red:#D6473C;
  --amber:#C58A1F;
  --radius:10px;
  --shadow:0 1px 2px rgba(15,36,56,.06), 0 4px 16px rgba(15,36,56,.05);
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.45;
}
a{color:inherit;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}

/* ===== App shell ===== */
#app{display:flex;min-height:100vh;min-height:100dvh;}

/* Sidebar */
#sidebar{
  width:224px;flex-shrink:0;background:var(--navy);
  color:#DCE6EF;display:flex;flex-direction:column;
  position:fixed;top:0;left:0;bottom:0;z-index:40;
  transition:transform .25s ease;
}
#sidebar .brand{
  padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,.08);
}
#sidebar .brand .logo-row{display:flex;align-items:center;gap:10px;}
#sidebar .brand .mark{
  width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(76,143,203,.4);
}
#sidebar .brand .name{font-weight:700;font-size:14.5px;color:#fff;letter-spacing:.2px;}
#sidebar .brand .sub{font-size:11px;color:#8FA5B8;margin-top:1px;}
#navlist{list-style:none;margin:0;padding:10px 10px;flex:1;overflow-y:auto;}
#navlist li{margin-bottom:2px;}
#navlist button{
  width:100%;display:flex;align-items:center;gap:10px;
  background:none;border:none;color:#B9C8D6;padding:9px 11px;border-radius:8px;
  font-size:13.3px;cursor:pointer;text-align:left;font-weight:500;transition:background .12s,color .12s;
}
#navlist button .ic{width:18px;text-align:center;font-size:14.5px;flex-shrink:0;}
#navlist button:hover{background:rgba(255,255,255,.06);color:#fff;}
#navlist button.active{background:var(--orange);color:#fff;box-shadow:0 2px 10px rgba(76,143,203,.35);}
#sidebar .foot{padding:12px 18px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7690A5;}

#sidebar-toggle{
  display:none;position:fixed;top:12px;left:12px;z-index:60;
  background:var(--navy);color:#fff;border:none;width:38px;height:38px;border-radius:9px;
  font-size:17px;box-shadow:var(--shadow);
}
#sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(15,36,56,.45);z-index:35;}

/* Main */
#main{margin-left:224px;flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--paper-2);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
#topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.2px;}
#topbar .crumb{font-size:12px;color:var(--ink-faint);margin-top:2px;}
#topbar .actions{display:flex;gap:8px;align-items:center;}

#content{padding:22px 26px 60px;max-width:1280px;width:100%;margin:0 auto;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .12s;white-space:nowrap;
}
.btn:hover{border-color:#C9D2DB;background:#FAFBFC;}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff;}
.btn.primary:hover{background:var(--orange-dark);border-color:var(--orange-dark);}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.navy:hover{background:var(--navy-2);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn.ghost:hover{background:var(--paper);color:var(--ink);}
.btn.danger{color:var(--red);}
.btn.danger:hover{background:#FDECEA;border-color:#F5C6C1;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;}

/* ===== Cards / layout ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}.grid.cols-2{grid-template-columns:1fr;}}

.section-title{font-size:15px;font-weight:700;margin:0 0 4px;}
.section-sub{font-size:12.5px;color:var(--ink-faint);margin:0 0 14px;}

/* KPI */
.kpi{padding:16px 18px;border-radius:var(--radius);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);}
.kpi .label{font-size:11.5px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.kpi .value{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.4px;}
.kpi .delta{font-size:11.5px;margin-top:4px;color:var(--ink-faint);}
.kpi.accent{border-color:rgba(76,143,203,.35);background:linear-gradient(180deg,#F2F7FB,#fff);}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar .grow{flex:1;min-width:180px;}
.search-input{
  width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;
  background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" stroke="%238C99A6" stroke-width="2"><circle cx="6" cy="6" r="5"/><line x1="10" y1="10" x2="13" y2="13"/></svg>') no-repeat 10px center;
  font-size:13px;
}
select.f-input, .f-input{
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;color:var(--ink);
}

/* Table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
table.tbl th{
  text-align:left;padding:10px 14px;background:var(--paper);color:var(--ink-soft);
  font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tbl td{padding:11px 14px;border-bottom:1px solid #EEF1F4;vertical-align:middle;}
table.tbl tbody tr:hover{background:#FAFBFD;}
table.tbl tbody tr:last-child td{border-bottom:none;}
.tbl-empty{padding:40px 20px;text-align:center;color:var(--ink-faint);}
.tbl-empty .big{font-size:28px;margin-bottom:6px;}

.num{font-variant-numeric:tabular-nums;font-family:var(--mono);}
.money{font-variant-numeric:tabular-nums;font-family:var(--mono);font-weight:600;}
.money.pos{color:var(--green);}
.money.neg{color:var(--red);}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;letter-spacing:.2px;}
.badge.gray{background:#EEF1F4;color:var(--ink-soft);}
.badge.orange{background:#E9F2FA;color:var(--orange-dark);}
.badge.green{background:#E4F6EE;color:var(--green);}
.badge.red{background:#FCE9E7;color:var(--red);}
.badge.blue{background:#E7F0FA;color:#2765A6;}
.badge.amber{background:#FBF1DC;color:var(--amber);}
.badge.navy{background:#E5EAF0;color:var(--navy-2);}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.c3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.c1{grid-template-columns:1fr;}
@media(max-width:640px){.form-grid,.form-grid.c3{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:5px;}
.field.span2{grid-column:span 2;}
.field label{font-size:12px;font-weight:700;color:var(--ink-soft);}
.field label .req{color:var(--orange-dark);}
.field .hint{font-size:11px;color:var(--ink-faint);}
.field input, .field select, .field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(76,143,203,.16);}
.field textarea{resize:vertical;min-height:60px;}
fieldset.grp{border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;margin:0;}
fieldset.grp legend{font-size:12px;font-weight:800;color:var(--navy-2);padding:0 6px;text-transform:uppercase;letter-spacing:.4px;}

/* Modal */
#modal-scrim{display:none;position:fixed;inset:0;background:rgba(15,36,56,.5);z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:26px 16px;backdrop-filter:blur(1px);}
#modal-scrim.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(15,36,56,.35);animation:modalIn .16s ease;}
.modal.wide{max-width:920px;}
@keyframes modalIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{margin:0;font-size:16px;font-weight:800;}
.modal-head button{background:none;border:none;font-size:18px;color:var(--ink-faint);cursor:pointer;padding:4px 8px;border-radius:6px;}
.modal-head button:hover{background:var(--paper);color:var(--ink);}
.modal-body{padding:20px 22px;max-height:72vh;overflow-y:auto;}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.tabs button{background:none;border:none;padding:10px 4px;margin-right:20px;font-size:13px;font-weight:700;color:var(--ink-faint);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tabs button.active{color:var(--navy);border-color:var(--orange);}

/* Toast */
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;animation:toastIn .18s ease;max-width:320px;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* Misc */
.hr{height:1px;background:var(--line);margin:16px 0;border:none;}
.muted{color:var(--ink-faint);}
.soft{color:var(--ink-soft);}
.flex-between{display:flex;align-items:center;justify-content:space-between;}
.stack{display:flex;flex-direction:column;gap:4px;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;}
.link-btn{background:none;border:none;color:var(--orange-dark);font-weight:700;font-size:12.5px;cursor:pointer;padding:0;}
.link-btn:hover{text-decoration:underline;}
.empty-state{padding:50px 20px;text-align:center;}
.empty-state .big{font-size:34px;margin-bottom:10px;}
.empty-state h4{margin:0 0 6px;font-size:15px;}
.empty-state p{margin:0 0 16px;color:var(--ink-faint);font-size:13px;}
.divider-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);font-weight:800;margin:18px 0 8px;}
.calc-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #EAEDF1;font-size:13px;}
.calc-line:last-child{border-bottom:none;}
.calc-line .lbl{color:var(--ink-soft);}
.calc-line.total{font-weight:800;font-size:14.5px;border-top:1px solid var(--line);border-bottom:none;padding-top:10px;margin-top:4px;}
.note-box{background:#F2F7FB;border:1px solid #C9DEEF;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#2E5C82;}
.note-box.blue{background:#F0F6FC;border-color:#CFE2F3;color:#2A567C;}
.note-box strong{display:block;margin-bottom:2px;}

@media(max-width:880px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-toggle{display:flex;align-items:center;justify-content:center;}
  #sidebar-scrim.open{display:block;}
  #main{margin-left:0;}
  #content{padding:18px 14px 50px;}
  #topbar{padding:12px 14px 12px 58px;}
}

/* Print (documento do orçamento) */
@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;padding:0;}
  #sidebar,#topbar,#modal-scrim{display:none!important;}
}

/* ---------- Utilitários gerais ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const nowISO = () => new Date().toISOString();
const todayBR = () => new Date().toLocaleDateString('pt-BR');

function fmtBRL(v){
  v = Number(v)||0;
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtNum(v,d=2){
  v = Number(v)||0;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtPct(v,d=1){
  return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
}
function fmtDateBR(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR');
}
function fmtDateTimeBR(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDaysISO(iso, days){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function round2(v){ return Math.round((Number(v)||0) * 100) / 100; }

/* Tempo de impressão em formato HH:MM (ex: 00:20 = 20 min, 30:00 = 30 horas) <-> horas decimais para cálculo */
function hhmmToDecimal(str){
  if(str==null) return 0;
  str = String(str).trim();
  if(!str) return 0;
  if(str.includes(':')){
    const parts = str.split(':');
    const h = parseInt(parts[0],10)||0;
    const m = parseInt(parts[1],10)||0;
    return h + (m/60);
  }
  const n = parseFloat(str.replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function decimalToHHMM(dec){
  dec = Number(dec)||0;
  let h = Math.floor(dec);
  let m = Math.round((dec - h) * 60);
  if(m>=60){ h += 1; m -= 60; }
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

/* ---------- Toasts ---------- */
function toast(msg, type=''){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast'+(type?' '+type:'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}

/* ============================================================
   CAMADA DE DADOS (armazenamento local no navegador)
   Usamos localStorage (equivalente a IndexedDB para este porte
   de dados): é síncrono, 100% suportado no Safari/iOS, e os
   dados permanecem salvos mesmo fechando o navegador.
   ============================================================ */
const DB_KEY = 'central_custos_3d_v1';

const DB = {
  data: null,

  load(){
    let raw = null;
    try{ raw = localStorage.getItem(DB_KEY); }catch(e){ /* storage indisponível */ }
    if(raw){
      try{ this.data = JSON.parse(raw); }catch(e){ this.data = null; }
    }
    if(!this.data){
      this.data = seedDatabase();
      this.save();
    }
    // garante presença de todas as coleções mesmo em bases antigas
    const defaults = defaultDatabaseShape();
    for(const k in defaults){
      if(!(k in this.data)) this.data[k] = defaults[k];
    }
    return this.data;
  },

  save(){
    const ok = this._localSave();
    if(ok && typeof Cloud !== 'undefined') Cloud.pushSingletons();
    return ok;
  },

  _localSave(){
    try{
      if(!this.data.meta) this.data.meta = { ultimaAtualizacao: null, ultimoExport: null, ultimoImport: null, dispositivo: null };
      this.data.meta.ultimaAtualizacao = nowISO();
      if(!this.data.meta.dispositivo) this.data.meta.dispositivo = uid();
      localStorage.setItem(DB_KEY, JSON.stringify(this.data));
      return true;
    }catch(e){
      toast('Não foi possível salvar: armazenamento cheio ou indisponível.', 'err');
      return false;
    }
  },

  // Helpers genéricos de CRUD por coleção
  all(col){ return this.data[col] || []; },
  get(col, id){ return (this.data[col]||[]).find(x=>x.id===id) || null; },
  upsert(col, item){
    if(!this.data[col]) this.data[col] = [];
    const idx = this.data[col].findIndex(x=>x.id===item.id);
    if(idx>=0) this.data[col][idx] = item; else this.data[col].push(item);
    this._localSave();
    if(typeof Cloud !== 'undefined') Cloud.pushRecord(col, item);
    return item;
  },
  remove(col, id){
    this.data[col] = (this.data[col]||[]).filter(x=>x.id!==id);
    this._localSave();
    if(typeof Cloud !== 'undefined') Cloud.deleteRecord(col, id);
  }
};

/* ============================================================
   MOTOR DE CÁLCULO
   ------------------------------------------------------------
   Funções puras, uma responsabilidade cada, espelhando a lógica
   da planilha original "CALCULO DE CUSTO.xlsx":
     custo total do lote =
         matéria-prima + energia + acessórios + rateio de custo
         fixo + depreciação da impressora
         + (% de falhas) x (matéria-prima + energia + depreciação) x 0.7
     custo unitário = custo total do lote / unidades do lote
     preço de venda = custo unitário x markup
     lucro bruto = preço - custo unitário
     lucro líquido = lucro bruto - lucro bruto x (imposto + tx.cartão + custo anúncio)
     margem = lucro líquido / preço
   O fator "x0.7" no custo de falhas e a base "lucro bruto" (em vez
   do preço) para deduzir imposto/tx.cartão/anúncio vêm da planilha
   original e foram preservados — ver seção "Observações e melhorias".
   ============================================================ */
const Calc = {

  // matéria-prima: peso (kg) x preço/kg x margem de reajuste fixa de 20%
  // (equivalente ao "desperdício" da planilha original, porém fixo — não é mais um campo editável)
  MARGEM_REAJUSTE_MATERIAL: 0.20,
  calcularCustoMaterial(pesoLoteG, precoKg){
    const pesoKg = (Number(pesoLoteG)||0) / 1000;
    const precoAjustado = (Number(precoKg)||0) * (1 + Calc.MARGEM_REAJUSTE_MATERIAL);
    return pesoKg * precoAjustado;
  },

  // energia: potência(W) x preço kWh / 1000 x horas de impressão do lote
  calcularCustoEnergia(potenciaW, kwhPreco, tempoLoteHoras){
    return ((Number(potenciaW)||0) * (Number(kwhPreco)||0) / 1000) * (Number(tempoLoteHoras)||0);
  },

  // acessórios: soma de (quantidade x custo unitário) de cada item do produto
  calcularCustoAcessorios(itensAcessorios, acessoriosDb){
    return (itensAcessorios||[]).reduce((sum, it)=>{
      const ac = acessoriosDb.find(a=>a.id===it.acessorioId);
      const custoUn = ac ? Number(ac.custoUnitario)||0 : (Number(it.custoUnitarioSnapshot)||0);
      return sum + custoUn * (Number(it.quantidade)||0);
    }, 0);
  },

  // rateio do custo fixo mensal do negócio pelas unidades estimadas/mês daquele produto
  calcularCustoFixoRateio(custoFixoMensal, unidadesMesEstimadas){
    const un = Number(unidadesMesEstimadas)||0;
    if(un<=0) return 0;
    return (Number(custoFixoMensal)||0) / un;
  },

  // depreciação da impressora proporcional ao tempo de impressão do lote
  calcularDepreciacao(valorMaquina, vidaUtilHoras, tempoLoteHoras){
    const vida = Number(vidaUtilHoras)||0;
    if(vida<=0) return 0;
    return (Number(valorMaquina)||0) / vida * (Number(tempoLoteHoras)||0);
  },

  // manutenção (opcional / melhoria — planilha original não tinha esta linha; fica em 0 se não preenchida)
  calcularCustoManutencao(manutencaoHora, tempoLoteHoras){
    return (Number(manutencaoHora)||0) * (Number(tempoLoteHoras)||0);
  },

  // custo adicional por falhas de impressão (percentual sobre material+energia+depreciação, fator 0.7 da planilha original)
  calcularCustoFalhas(falhaPercent, custoMaterial, custoEnergia, custoDepreciacao){
    return (Number(falhaPercent)||0) * (custoMaterial + custoEnergia + custoDepreciacao) * 0.7;
  },

  // custo total do lote de produção (todas as parcelas)
  calcularCustoTotalLote(partes){
    const {custoMaterial=0, custoEnergia=0, custoAcessorios=0, custoFixoRateio=0, custoDepreciacao=0, custoManutencao=0, custoFalhas=0} = partes;
    return custoMaterial + custoEnergia + custoAcessorios + custoFixoRateio + custoDepreciacao + custoManutencao + custoFalhas;
  },

  calcularCustoUnitario(custoTotalLote, unidadesLote){
    const un = Number(unidadesLote)||0;
    if(un<=0) return 0;
    return custoTotalLote / un;
  },

  calcularPrecoVenda(custoUnitario, markup){
    return (Number(custoUnitario)||0) * (Number(markup)||0);
  },

  calcularLucroBruto(precoVenda, custoUnitario){
    return (Number(precoVenda)||0) - (Number(custoUnitario)||0);
  },

  // imposto, taxa de cartão e custo de anúncio são deduzidos sobre o LUCRO BRUTO (metodologia da planilha original)
  calcularLucroLiquido(lucroBruto, imposto, taxaCartao, custoAnuncio){
    const lb = Number(lucroBruto)||0;
    return lb - lb*(Number(imposto)||0) - lb*(Number(taxaCartao)||0) - lb*(Number(custoAnuncio)||0);
  },

  calcularMargem(lucroLiquido, precoVenda){
    const pv = Number(precoVenda)||0;
    if(pv<=0) return 0;
    return (Number(lucroLiquido)||0) / pv;
  },

  calcularTotalItem(quantidade, precoUnitario){
    return (Number(quantidade)||0) * (Number(precoUnitario)||0);
  },

  calcularTotalPedido(itens, desconto={tipo:'valor',valor:0}, frete=0){
    const subtotal = (itens||[]).reduce((s,i)=>s + Calc.calcularTotalItem(i.quantidade, i.precoUnitario), 0);
    let descValor = 0;
    if(desconto){
      descValor = desconto.tipo==='percentual' ? subtotal * ((Number(desconto.valor)||0)/100) : (Number(desconto.valor)||0);
    }
    const total = subtotal - descValor + (Number(frete)||0);
    return { subtotal, desconto: descValor, frete: Number(frete)||0, total };
  },

  // Cálculo completo de um produto: retorna todas as parcelas + preços (consumidor e lojista)
  // ctx = { produto, material, impressora, acessoriosDb, config }
  calcularProdutoCompleto(ctx){
    const { produto, material, impressora, acessoriosDb, config } = ctx;

    const precoKg = (produto.precoKgOverride!=null && produto.precoKgOverride!=='') ? Number(produto.precoKgOverride)||0 : (material ? Number(material.custoKg)||0 : 0);
    const custoMaterial = Calc.calcularCustoMaterial(produto.pesoLoteG, precoKg);

    const potenciaW = impressora ? Number(impressora.potenciaW)||0 : 0;
    const custoEnergia = Calc.calcularCustoEnergia(potenciaW, config.kwhPreco, produto.tempoLoteHoras);

    const custoAcessorios = Calc.calcularCustoAcessorios(produto.acessorios, acessoriosDb);

    const custoFixoRateio = Calc.calcularCustoFixoRateio(config.custoFixoMensal, produto.unidadesMesEstimadas);

    const valorMaquina = impressora ? Number(impressora.valorMaquina)||0 : 0;
    const vidaUtil = impressora ? Number(impressora.vidaUtilHoras)||0 : 0;
    const custoDepreciacao = Calc.calcularDepreciacao(valorMaquina, vidaUtil, produto.tempoLoteHoras);

    const manutencaoHora = impressora ? Number(impressora.manutencaoHora)||0 : 0;
    const custoManutencao = Calc.calcularCustoManutencao(manutencaoHora, produto.tempoLoteHoras);

    const custoFalhas = Calc.calcularCustoFalhas(produto.falhaPercent, custoMaterial, custoEnergia, custoDepreciacao);

    const custoTotalLote = Calc.calcularCustoTotalLote({custoMaterial,custoEnergia,custoAcessorios,custoFixoRateio,custoDepreciacao,custoManutencao,custoFalhas});
    const custoUnitario = Calc.calcularCustoUnitario(custoTotalLote, produto.unidadesLote);

    // acessórios/insumos (ex.: horas de modelagem, embalagem, etc.) NÃO entram na base
    // que recebe o markup — são somados "por fora", como repasse de custo real, para não
    // serem multiplicados junto com o material quando o markup é alto.
    const un = Number(produto.unidadesLote)||0;
    const custoAcessoriosUnitario = un>0 ? custoAcessorios/un : 0;
    const custoUnitarioBaseMarkup = custoUnitario - custoAcessoriosUnitario;

    const imposto = produto.impostoOverride!=null ? produto.impostoOverride : config.impostoPadrao;
    const taxaCartao = produto.taxaCartaoOverride!=null ? produto.taxaCartaoOverride : config.taxaCartaoPadrao;
    const custoAnuncio = produto.custoAnuncioOverride!=null ? produto.custoAnuncioOverride : config.custoAnuncioPadrao;

    const markupConsumidor = produto.markupPadrao!=null ? produto.markupPadrao : config.markupConsumidorPadrao;
    const markupLojista = produto.markupLojistaPadrao!=null ? produto.markupLojistaPadrao : config.markupLojistaPadrao;

    const precoConsumidor = Calc.calcularPrecoVenda(custoUnitarioBaseMarkup, markupConsumidor) + custoAcessoriosUnitario;
    const lucroBrutoConsumidor = Calc.calcularLucroBruto(precoConsumidor, custoUnitario);
    const lucroLiquidoConsumidor = Calc.calcularLucroLiquido(lucroBrutoConsumidor, imposto, taxaCartao, custoAnuncio);
    const margemConsumidor = Calc.calcularMargem(lucroLiquidoConsumidor, precoConsumidor);

    const precoLojista = Calc.calcularPrecoVenda(custoUnitarioBaseMarkup, markupLojista) + custoAcessoriosUnitario;
    const lucroBrutoLojista = Calc.calcularLucroBruto(precoLojista, custoUnitario);
    // metodologia original: para o lojista, apenas o imposto é deduzido do lucro bruto (sem tx.cartão/anúncio)
    const lucroLiquidoLojista = Calc.calcularLucroLiquido(lucroBrutoLojista, imposto, 0, 0);
    const margemLojista = Calc.calcularMargem(lucroLiquidoLojista, precoLojista);

    return {
      custoMaterial, custoEnergia, custoAcessorios, custoFixoRateio, custoDepreciacao, custoManutencao, custoFalhas,
      custoTotalLote, custoUnitario, custoAcessoriosUnitario, custoUnitarioBaseMarkup,
      imposto, taxaCartao, custoAnuncio, markupConsumidor, markupLojista,
      precoConsumidor, lucroBrutoConsumidor, lucroLiquidoConsumidor, margemConsumidor,
      precoLojista, lucroBrutoLojista, lucroLiquidoLojista, margemLojista
    };
  }
};

const App = {
  route: 'dashboard',
  routeParam: null,

  init(){
    DB.load();
    this.renderNav();
    this.applyBrand();
    this.bindGlobal();
    this.goto('dashboard');
    if(typeof Cloud !== 'undefined') Cloud.bootCheck();
  },

  applyBrand(){
    const c = DB.data.config;
    document.getElementById('brand-name').textContent = c.empresaNome || 'Central de Custos';
    const mark = document.getElementById('brand-mark');
    if(c.empresaLogo){
      mark.innerHTML = `<img src="${c.empresaLogo}" style="width:100%;height:100%;object-fit:cover;border-radius:9px;">`;
    } else {
      const initials = (c.empresaNome||'3D').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
      mark.textContent = initials || '3D';
    }
    const foot = document.getElementById('sidebar-foot');
    if(foot){
      const meta = DB.data.meta || {};
      foot.innerHTML = meta.ultimaAtualizacao
        ? `v1.0 &middot; dados deste dispositivo, atualizados em ${fmtDateTimeBR(meta.ultimaAtualizacao)}`
        : `v1.0 &middot; dados salvos neste dispositivo`;
    }
  },

  renderNav(){
    const ul = document.getElementById('navlist');
    ul.innerHTML = SECTIONS.map(s=>`
      <li><button data-route="${s.id}" class="${this.route===s.id?'active':''}">
        <span class="ic">${s.ic}</span><span>${s.label}</span>
      </button></li>`).join('');
    ul.querySelectorAll('button').forEach(b=>{
      b.onclick = ()=>{ this.goto(b.dataset.route); this.closeSidebar(); };
    });
  },

  bindGlobal(){
    document.getElementById('sidebar-toggle').onclick = ()=> this.toggleSidebar();
  },
  toggleSidebar(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebar-scrim').classList.toggle('open');
  },
  closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-scrim').classList.remove('open');
  },

  goto(route, param=null){
    this.route = route;
    this.routeParam = param;
    this.renderNav();
    const sec = SECTIONS.find(s=>s.id===route);
    document.getElementById('page-title').textContent = sec ? sec.label : '';
    document.getElementById('topbar-actions').innerHTML = '';
    window.scrollTo(0,0);
    const renderers = {
      dashboard: Views.dashboard,
      clientes: Views.clientes,
      produtos: Views.produtos,
      materiais: Views.materiais,
      impressoras: Views.impressoras,
      acessorios: Views.acessorios,
      calculadora: Views.calculadora,
      precificacao: Views.precificacao,
      orcamentos: Views.orcamentos,
      financeiro: Views.financeiro,
      relatorios: Views.relatorios,
      config: Views.config
    };
    const crumbs = {
      dashboard:'Visão geral do negócio', clientes:'Cadastro e histórico de clientes',
      produtos:'Catálogo de produtos de impressão 3D', materiais:'Filamentos e matérias-primas',
      impressoras:'Parque de impressoras', acessorios:'Componentes e embalagens',
      calculadora:'Simule o custo de fabricação de um produto', precificacao:'Markup, impostos e margem por produto',
      orcamentos:'Crie, edite e acompanhe orçamentos',
      financeiro:'Compras de material, despesas e fluxo de caixa real',
      relatorios:'Indicadores do negócio',
      config:'Dados da empresa e parâmetros padrão do sistema'
    };
    document.getElementById('page-crumb').textContent = crumbs[route] || '';
    const fn = renderers[route];
    if(fn) fn(param);
  }
};

const Modal = {
  open(html, {wide=false}={}){
    const modal = document.getElementById('modal');
    modal.className = 'modal'+(wide?' wide':'');
    modal.innerHTML = html;
    document.getElementById('modal-scrim').classList.add('open');
  },
  close(){
    document.getElementById('modal-scrim').classList.remove('open');
    document.getElementById('modal').innerHTML = '';
    if(window._prevDocTitle){ document.title = window._prevDocTitle; window._prevDocTitle = null; }
  }
};
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('modal-scrim').addEventListener('click', (e)=>{
    if(e.target.id==='modal-scrim') Modal.close();
  });
});

/* Confirmação simples antes de excluir */
function confirmAction(msg, onYes){
  Modal.open(`
    <div class="modal-head"><h3>Confirmar ação</h3><button onclick="Modal.close()">&times;</button></div>
    <div class="modal-body"><p>${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="btn" onclick="Modal.close()">Cancelar</button>
      <button class="btn danger" id="confirm-yes-btn">Confirmar</button>
    </div>
  `);
  document.getElementById('confirm-yes-btn').onclick = ()=>{ Modal.close(); onYes(); };
}

Views._miniOrcTable = function(list){

  return `<div class="tbl-wrap" style="box-shadow:none;"><table class="tbl"><thead><tr><th>Número</th><th>Cliente</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead><tbody>
    ${list.map(o=>{
      const cli = DB.get('clientes', o.clienteId);
      return `<tr style="cursor:pointer;" onclick="Orcamentos.abrir('${o.id}')">
        <td class="num">#${o.numero}</td><td>${esc(cli?cli.nome:'—')}</td><td>${fmtDateBR(o.data)}</td>

};

Views._statusBars = function(orcs){
  const statuses = Orcamentos.STATUSES;
  const total = orcs.length || 1;
  return `<div class="stack" style="gap:10px;margin-top:6px;">` + statuses.map(s=>{
    const n = orcs.filter(o=>o.status===s.id).length;
    const pct = Math.round(n/total*100);
    return `<div>
      <div class="flex-between" style="font-size:12px;margin-bottom:3px;"><span class="soft">${s.label}</span><span class="muted">${n}</span></div>
      <div style="height:6px;background:#EEF1F4;border-radius:4px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${s.color};"></div></div>
    </div>`;
  }).join('') + `</div>`;
};

Views.clientes = function(){

      const okQ = !q || [c.nome,c.fantasia,c.cpfCnpj,c.cidade,c.whatsapp].join(' ').toLowerCase().includes(q);
      const okS = !st || c.status===st;
      return okQ && okS;

  abrirForm(id){
    const c = id ? DB.get('clientes', id) : {
      id: uid(), nome:'', fantasia:'', cpfCnpj:'', whatsapp:'', email:'', endereco:'', numero:'', bairro:'',
      cidade:'', estado:'', cep:'', obs:'', dataCadastro: todayISO(), status:'ativo'
    };
    Modal.open(`
      <div class="modal-head"><h3>${id?'Editar cliente':'Novo cliente'}</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <form id="cli-form">
          <div class="form-grid">
            <div class="field span2"><label>Nome / Razão social <span class="req">*</span></label><input required name="nome" value="${esc(c.nome)}"></div>
            <div class="field"><label>Nome fantasia</label><input name="fantasia" value="${esc(c.fantasia)}"></div>

            <div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(c.whatsapp)}" placeholder="(47) 99999-9999"></div>
            <div class="field"><label>E-mail</label><input type="email" name="email" value="${esc(c.email)}"></div>
            <div class="field span2"><label>Endereço</label><input name="endereco" value="${esc(c.endereco)}"></div>

      <div class="modal-head"><h3>Histórico — ${esc(c.nome)}</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">

          ${orcs.map(o=>`<tr style="cursor:pointer;" onclick="Modal.close();Orcamentos.abrir('${o.id}')">
            <td class="num">#${o.numero}</td><td>${fmtDateBR(o.data)}</td><td>${(o.itens||[]).length}</td>
            <td class="money">${fmtBRL(o.totais?.total||0)}</td><td>${Orcamentos.statusBadge(o.status)}</td>
            <td>${o.dataAprovacao?fmtDateBR(o.dataAprovacao):'—'}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="tbl-empty">Nenhum orçamento registrado para este cliente.</div>`}

        <button class="btn primary" onclick="Modal.close();Orcamentos.novo('${c.id}')">+ Novo orçamento</button>

};

const Materiais = {
  renderTable(){
    const q = (document.getElementById('mat-search')?.value||'').toLowerCase();
    const list = DB.all('materiais').filter(m=>!q || [m.nome,m.tipo,m.marca,m.cor].join(' ').toLowerCase().includes(q))
      .sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    const el = document.getElementById('mat-table');
    if(!list.length){ el.innerHTML = `<div class="card"><div class="empty-state"><div class="big">&#129525;</div><h4>Nenhum material cadastrado</h4><p>Cadastre filamentos e outras matérias-primas.</p><button class="btn primary" onclick="Materiais.abrirForm()">+ Novo material</button></div></div>`; return; }
    el.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Nome</th><th>Tipo</th><th>Marca / Cor</th><th>Peso do rolo</th><th>Valor/kg</th><th>Atualizado em</th><th>Status</th><th></th>
    </tr></thead><tbody>
      ${list.map(m=>`<tr>
        <td><strong>${esc(m.nome)}</strong></td>
        <td>${esc(m.tipo)||'—'}</td>
        <td>${esc(m.marca)||''}${m.cor?' · '+esc(m.cor):''}</td>
        <td class="num">${fmtNum(m.pesoRolo,2)} kg</td>
        <td class="money">${fmtBRL(m.custoKg)}</td>
        <td>${m.dataAtualizacaoPreco ? fmtDateBR(m.dataAtualizacaoPreco) : '—'}</td>
        <td>${m.status==='ativo'?'<span class="badge green">Ativo</span>':'<span class="badge gray">Inativo</span>'}</td>
        <td class="row-actions">
          <button class="btn sm ghost" onclick="Materiais.abrirForm('${m.id}')">Editar</button>
          <button class="btn sm danger ghost" onclick="Materiais.excluir('${m.id}')">Excluir</button>
        </td>
      </tr>`).join('')}
    </tbody></table></div>`;
  },

  abrirForm(id){
    const m = id ? DB.get('materiais', id) : {id:uid(), nome:'', tipo:'', marca:'', cor:'', pesoRolo:1, precoRolo:0, dataCompra:'', fornecedor:'', obs:'', status:'ativo'};
    Modal.open(`
      <div class="modal-head"><h3>${id?'Editar material':'Novo material'}</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <form id="mat-form">
          <div class="form-grid c3">
            <div class="field span2"><label>Nome <span class="req">*</span></label><input required name="nome" value="${esc(m.nome)}"></div>
            <div class="field"><label>Tipo</label><input name="tipo" value="${esc(m.tipo)}" placeholder="PLA, PETG, Nylon, TPU..."></div>
            <div class="field"><label>Marca</label><input name="marca" value="${esc(m.marca)}"></div>
            <div class="field"><label>Cor</label><input name="cor" value="${esc(m.cor)}"></div>
            <div class="field"><label>Fornecedor</label><input name="fornecedor" value="${esc(m.fornecedor)}"></div>
            <div class="field"><label>Peso do rolo (kg) <span class="req">*</span></label><input required type="number" step="0.001" name="pesoRolo" value="${m.pesoRolo}" oninput="Materiais._recalc()"></div>
            <div class="field"><label>Valor por kg (R$) <span class="req">*</span></label><input required type="number" step="0.01" name="custoKg" value="${m.custoKg!=null?m.custoKg:''}" oninput="Materiais._recalc()"></div>
            <div class="field"><label>Preço total do rolo (calculado)</label><input readonly id="mat-precorolo-view" value="${fmtBRL((m.custoKg||0)*(m.pesoRolo||1))}"></div>
            <div class="field"><label>Última atualização do preço</label><input readonly value="${m.dataAtualizacaoPreco?fmtDateBR(m.dataAtualizacaoPreco):'—'}"></div>
            <div class="field"><label>Data da compra</label><input type="date" name="dataCompra" value="${esc(m.dataCompra)}"></div>
            <div class="field"><label>Status</label><select name="status"><option value="ativo" ${m.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${m.status==='inativo'?'selected':''}>Inativo</option></select></div>
            <div class="field span2"><label>Observações</label><textarea name="obs">${esc(m.obs)}</textarea></div>
          </div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="Modal.close()">Cancelar</button>
        <button class="btn primary" onclick="Materiais.salvar('${m.id}', ${id?'true':'false'})">Salvar material</button>
      </div>
    `);
  },

  _recalc(){
    const form = document.getElementById('mat-form');
    const fd = new FormData(form);
    const k = parseFloat(fd.get('custoKg'))||0;
    const p = parseFloat(fd.get('pesoRolo'))||1;
    document.getElementById('mat-precorolo-view').value = fmtBRL(k*p);
  },

  salvar(id, isEdit){
    const form = document.getElementById('mat-form');
    const fd = new FormData(form);
    if(!fd.get('nome') || !fd.get('nome').trim()){ toast('Informe o nome do material.', 'err'); return; }
    const existing = isEdit ? DB.get('materiais', id) : {id};
    const m = Object.assign({}, existing);
    ['nome','tipo','marca','cor','fornecedor','dataCompra','obs','status'].forEach(k2=>{ m[k2]=fd.get(k2)||''; });
    m.pesoRolo = parseFloat(fd.get('pesoRolo'))||1;
    const novoCustoKg = parseFloat(fd.get('custoKg'))||0;
    if(existing.custoKg==null || Math.abs(novoCustoKg - existing.custoKg) > 0.0001){
      m.dataAtualizacaoPreco = todayISO();
    } else {
      m.dataAtualizacaoPreco = existing.dataAtualizacaoPreco || todayISO();
    }
    m.custoKg = novoCustoKg;
    m.precoRolo = novoCustoKg * m.pesoRolo;
    if(!m.status) m.status='ativo';
    DB.upsert('materiais', m);
    Modal.close();
    toast('Material salvo com sucesso.', 'ok');
    Materiais.renderTable();
  },

  excluir(id){
    const emUso = DB.all('produtos').filter(p=>p.materialId===id).length;
    const msg = emUso ? `Este material é usado em ${emUso} produto(s). Excluir mesmo assim? Os produtos manterão o preço já registrado.` : 'Deseja realmente excluir este material?';
    confirmAction(msg, ()=>{ DB.remove('materiais', id); toast('Material excluído.', 'ok'); Materiais.renderTable(); });
  }
};

Views.impressoras = function(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="toolbar"><div class="grow"></div><button class="btn primary" onclick="Impressoras.abrirForm()">+ Nova impressora</button></div>
    <div id="imp-table"></div>
  `;
  Impressoras.renderTable();
};
const Impressoras = {
  renderTable(){
    const list = DB.all('impressoras').sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    const el = document.getElementById('imp-table');
    if(!list.length){ el.innerHTML = `<div class="card"><div class="empty-state"><div class="big">&#128424;&#65039;</div><h4>Nenhuma impressora cadastrada</h4><button class="btn primary" onclick="Impressoras.abrirForm()">+ Nova impressora</button></div></div>`; return; }
    el.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Nome</th><th>Modelo</th><th>Potência</th><th>Valor da máquina</th><th>Vida útil</th><th>Depreciação/h</th><th>Manutenção total</th><th>Status</th><th></th>
    </tr></thead><tbody>
      ${list.map(i=>{
        const depH = i.vidaUtilHoras>0 ? i.valorMaquina/i.vidaUtilHoras : 0;
        const totalManut = (i.manutencoes||[]).reduce((s,m)=>s+(Number(m.valor)||0),0);
        return `<tr>
        <td><strong>${esc(i.nome)}</strong></td><td>${esc(i.modelo)||'—'}</td>
        <td class="num">${fmtNum(i.potenciaW,0)} W</td><td class="money">${fmtBRL(i.valorMaquina)}</td>
        <td class="num">${fmtNum(i.vidaUtilHoras,0)} h</td><td class="money">${fmtBRL(depH)}</td>
        <td class="money">${fmtBRL(totalManut)}</td>
        <td>${i.status==='ativo'?'<span class="badge green">Ativa</span>':'<span class="badge gray">Inativa</span>'}</td>
        <td class="row-actions"><button class="btn sm" onclick="Impressoras.abrirManutencao('${i.id}')">Manutenção / retorno</button><button class="btn sm ghost" onclick="Impressoras.abrirForm('${i.id}')">Editar</button><button class="btn sm danger ghost" onclick="Impressoras.excluir('${i.id}')">Excluir</button></td>
      </tr>`;}).join('')}
    </tbody></table></div>`;
  },

  abrirManutencao(id){
    const imp = DB.get('impressoras', id);
    if(!imp) return;
    if(!imp.manutencoes) imp.manutencoes = [];
    const investido = (Number(imp.valorMaquina)||0) + imp.manutencoes.reduce((s,m)=>s+(Number(m.valor)||0),0);

    // recuperado via depreciação cobrada em pedidos FECHADOS que usaram esta impressora
    let recuperado = 0;
    DB.all('orcamentos').filter(o=>o.fechado).forEach(o=>{
      (o.itens||[]).forEach(it=>{
        if(it.impressoraIdSnapshot === id){
          recuperado += (Number(it.custoDepreciacaoUnitarioSnapshot)||0) * (Number(it.quantidade)||0);
        }
      });
    });
    const falta = Math.max(0, investido - recuperado);
    const pct = investido>0 ? Math.min(100, recuperado/investido*100) : 0;

    Modal.open(`
      <div class="modal-head"><h3>${esc(imp.nome)} — manutenção e retorno</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <div class="card card-pad" style="background:var(--paper);margin-bottom:16px;">
          <div class="section-title">Retorno do investimento</div>
          <div class="section-sub">Compara o quanto foi investido na máquina (compra + manutenções) com o quanto já foi recuperado via depreciação cobrada em pedidos fechados.</div>
          <div class="calc-line"><span class="lbl">Valor investido (máquina + manutenções)</span><span class="money">${fmtBRL(investido)}</span></div>
          <div class="calc-line"><span class="lbl">Recuperado até agora (depreciação em pedidos fechados)</span><span class="money pos">${fmtBRL(recuperado)}</span></div>
          <div class="calc-line total"><span class="lbl">${falta<=0?'Máquina já se pagou! Saldo positivo':'Ainda falta recuperar'}</span><span class="money" style="color:${falta<=0?'var(--green)':'var(--red)'};">${falta<=0?fmtBRL(recuperado-investido):fmtBRL(falta)}</span></div>
          <div style="height:8px;background:#EEF1F4;border-radius:4px;overflow:hidden;margin-top:10px;"><div style="height:100%;width:${pct}%;background:${pct>=100?'var(--green)':'var(--orange)'};"></div></div>
          <div class="muted" style="font-size:11px;margin-top:4px;">${fmtPct(pct,0)} recuperado</div>
        </div>
        <div class="divider-label">Peças e manutenções realizadas</div>
        <div id="imp-manut-list"></div>
        <button type="button" class="btn sm" style="margin-top:8px;" onclick="Impressoras.abrirManutencaoForm('${id}')">+ Registrar manutenção</button>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Fechar</button></div>
    `, {wide:true});
    Impressoras._renderManutList(id);
  },

  _renderManutList(impId){
    const imp = DB.get('impressoras', impId);
    const list = (imp.manutencoes||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    const el = document.getElementById('imp-manut-list');
    if(!el) return;
    if(!list.length){ el.innerHTML = `<div class="tbl-empty">Nenhuma manutenção registrada ainda.</div>`; return; }
    el.innerHTML = `<div class="tbl-wrap" style="box-shadow:none;"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th><th></th></tr></thead><tbody>
      ${list.map(m=>`<tr><td>${fmtDateBR(m.data)}</td><td>${esc(m.descricao)}</td><td class="money">${fmtBRL(m.valor)}</td>
        <td class="row-actions"><button class="btn sm danger ghost" onclick="Impressoras.excluirManutencao('${impId}','${m.id}')">Excluir</button></td></tr>`).join('')}
    </tbody></table></div>`;
  },

  abrirManutencaoForm(impId){
    Modal.open(`
      <div class="modal-head"><h3>Registrar manutenção</h3><button onclick="Impressoras.abrirManutencao('${impId}')">&times;</button></div>
      <div class="modal-body">
        <form id="manut-form">
          <div class="form-grid">
            <div class="field span2"><label>Descrição (peça / serviço) <span class="req">*</span></label><input required name="descricao" placeholder="Ex: troca de bico, correia, fonte..."></div>
            <div class="field"><label>Data</label><input type="date" name="data" value="${todayISO()}"></div>
            <div class="field"><label>Valor (R$) <span class="req">*</span></label><input required type="number" step="0.01" name="valor"></div>
          </div>
        </form>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Impressoras.abrirManutencao('${impId}')">Cancelar</button><button class="btn primary" onclick="Impressoras.salvarManutencao('${impId}')">Salvar</button></div>
    `);
  },

  salvarManutencao(impId){
    const form = document.getElementById('manut-form');
    const fd = new FormData(form);
    if(!fd.get('descricao') || !fd.get('valor')){ toast('Preencha descrição e valor.', 'err'); return; }
    const imp = DB.get('impressoras', impId);
    if(!imp.manutencoes) imp.manutencoes = [];
    imp.manutencoes.push({ id: uid(), descricao: fd.get('descricao'), data: fd.get('data')||todayISO(), valor: parseFloat(fd.get('valor'))||0 });
    DB.upsert('impressoras', imp);
    toast('Manutenção registrada.', 'ok');
    Impressoras.abrirManutencao(impId);
  },

  excluirManutencao(impId, manutId){
    const imp = DB.get('impressoras', impId);
    imp.manutencoes = (imp.manutencoes||[]).filter(m=>m.id!==manutId);
    DB.upsert('impressoras', imp);
    toast('Manutenção excluída.', 'ok');
    Impressoras.abrirManutencao(impId);
  },
  abrirForm(id){
    const i = id ? DB.get('impressoras', id) : {id:uid(), nome:'', modelo:'', potenciaW:1200, valorMaquina:4500, vidaUtilHoras:20000, manutencaoHora:0, obs:'', status:'ativo'};
    Modal.open(`
      <div class="modal-head"><h3>${id?'Editar impressora':'Nova impressora'}</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <form id="imp-form">
          <div class="form-grid c3">
            <div class="field span2"><label>Nome <span class="req">*</span></label><input required name="nome" value="${esc(i.nome)}"></div>
            <div class="field"><label>Modelo</label><input name="modelo" value="${esc(i.modelo)}"></div>
            <div class="field"><label>Potência (W)</label><input type="number" step="1" name="potenciaW" value="${i.potenciaW}"></div>
            <div class="field"><label>Valor da máquina (R$)</label><input type="number" step="0.01" name="valorMaquina" value="${i.valorMaquina}"></div>
            <div class="field"><label>Vida útil (horas)</label><input type="number" step="1" name="vidaUtilHoras" value="${i.vidaUtilHoras}"></div>
            <div class="field"><label>Manutenção por hora (R$)</label><input type="number" step="0.01" name="manutencaoHora" value="${i.manutencaoHora}"></div>
            <div class="field span2"><label>Status</label><select name="status"><option value="ativo" ${i.status==='ativo'?'selected':''}>Ativa</option><option value="inativo" ${i.status==='inativo'?'selected':''}>Inativa</option></select></div>
            <div class="field span2"><label>Observações</label><textarea name="obs">${esc(i.obs)}</textarea></div>
          </div>
        </form>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn primary" onclick="Impressoras.salvar('${i.id}', ${id?'true':'false'})">Salvar impressora</button></div>
    `);
  },
  salvar(id, isEdit){
    const form = document.getElementById('imp-form');
    const fd = new FormData(form);
    if(!fd.get('nome') || !fd.get('nome').trim()){ toast('Informe o nome da impressora.', 'err'); return; }
    const existing = isEdit ? DB.get('impressoras', id) : {id};
    const i = Object.assign({}, existing);
    ['nome','modelo','obs','status'].forEach(k=>{ i[k]=fd.get(k)||''; });
    i.potenciaW = parseFloat(fd.get('potenciaW'))||0;
    i.valorMaquina = parseFloat(fd.get('valorMaquina'))||0;
    i.vidaUtilHoras = parseFloat(fd.get('vidaUtilHoras'))||0;
    i.manutencaoHora = parseFloat(fd.get('manutencaoHora'))||0;
    if(!i.status) i.status='ativo';
    DB.upsert('impressoras', i);
    Modal.close(); toast('Impressora salva com sucesso.', 'ok'); Impressoras.renderTable();
  },
  excluir(id){
    const emUso = DB.all('produtos').filter(p=>p.impressoraId===id).length;
    const msg = emUso ? `Esta impressora é usada em ${emUso} produto(s). Excluir mesmo assim?` : 'Deseja realmente excluir esta impressora?';
    confirmAction(msg, ()=>{ DB.remove('impressoras', id); toast('Impressora excluída.', 'ok'); Impressoras.renderTable(); });
  }
};

      <div class="modal-head"><h3>${id?'Editar acessório':'Novo acessório'}</h3><button onclick="Modal.close()">&times;</button></div>

            <div class="field"><label>Status</label><select name="status"><option value="ativo" ${a.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${a.status==='inativo'?'selected':''}>Inativo</option></select></div>
            <div class="field span2"><label>Observações</label><textarea name="obs">${esc(a.obs)}</textarea></div>
          </div>
        </form>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn primary" onclick="Acessorios.salvar('${a.id}', ${id?'true':'false'})">Salvar acessório</button></div>
    `);
  },
  salvar(id, isEdit){
    const form = document.getElementById('ace-form');
    const fd = new FormData(form);
    if(!fd.get('nome') || !fd.get('nome').trim()){ toast('Informe o nome do acessório.', 'err'); return; }
    const existing = isEdit ? DB.get('acessorios', id) : {id};
    const a = Object.assign({}, existing);
    ['nome','unidade','fornecedor','obs','status'].forEach(k=>{ a[k]=fd.get(k)||''; });
    a.custoUnitario = parseFloat(fd.get('custoUnitario'))||0;

  }
};

/* ---------------- PRODUTOS ---------------- */
Views.produtos = function(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="toolbar">
      <div class="grow"><input class="search-input" id="prod-search" placeholder="Pesquisar produto por nome ou código..."></div>
      <button class="btn primary" onclick="Produtos.abrirForm()">+ Novo produto</button>
    </div>
    <div id="prod-table"></div>
  `;
  document.getElementById('prod-search').oninput = Produtos.renderTable;
  Produtos.renderTable();
};

const Produtos = {
  renderTable(){
    const q = (document.getElementById('prod-search')?.value||'').toLowerCase();
    const list = DB.all('produtos').filter(p=>!q||[p.nome,p.codigo].join(' ').toLowerCase().includes(q)).sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    const cfg = DB.data.config;
    const el = document.getElementById('prod-table');
    if(!list.length){ el.innerHTML = `<div class="card"><div class="empty-state"><div class="big">&#128230;</div><h4>Nenhum produto cadastrado</h4><button class="btn primary" onclick="Produtos.abrirForm()">+ Novo produto</button></div></div>`; return; }
    el.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Produto</th><th>Material</th><th>Peso lote</th><th>Un./lote</th><th>Custo un.</th><th>Preço consumidor</th><th>Margem</th><th>Status</th><th></th>
    </tr></thead><tbody>
      ${list.map(p=>{
        const r = Produtos.calcular(p);
        return `<tr>
          <td><strong>${esc(p.nome)}</strong>${p.codigo?`<div class="muted" style="font-size:11.5px;">${esc(p.codigo)}</div>`:''}${p.clienteOrigemNome?`<div class="muted" style="font-size:11px;">Cliente: ${esc(p.clienteOrigemNome)}</div>`:''}</td>
          <td>${esc((DB.get('materiais',p.materialId)||{}).nome)||'—'}</td>
          <td class="num">${fmtNum(p.pesoLoteG,0)} g</td>
          <td class="num">${p.unidadesLote}</td>
          <td class="money">${fmtBRL(r.custoUnitario)}</td>
          <td class="money">${fmtBRL(r.precoConsumidor)}</td>
          <td>${Produtos._margemBadge(r.margemConsumidor)}</td>
          <td>${p.status==='ativo'?'<span class="badge green">Ativo</span>':'<span class="badge gray">Inativo</span>'}</td>
          <td class="row-actions">
            <button class="btn sm" onclick="Precificacao.abrir('${p.id}')">Precificar</button>
            <button class="btn sm ghost" onclick="Produtos.abrirForm('${p.id}')">Editar</button>
            <button class="btn sm danger ghost" onclick="Produtos.excluir('${p.id}')">Excluir</button>
          </td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
  },

  _margemBadge(m){
    const pct = m*100;
    const cls = pct>=40 ? 'green' : pct>=20 ? 'amber' : 'red';
    return `<span class="badge ${cls}">${fmtPct(pct)}</span>`;
  },

  calcular(produto){
    const material = DB.get('materiais', produto.materialId);
    const impressora = DB.get('impressoras', produto.impressoraId);
    return Calc.calcularProdutoCompleto({produto, material, impressora, acessoriosDb: DB.all('acessorios'), config: DB.data.config});
  },

  abrirForm(id){
    const p = id ? DB.get('produtos', id) : {
      id:uid(), nome:'', codigo:'', descricao:'', materialId:'', impressoraId:'',
      pesoLoteG:0, tempoLoteHoras:0, unidadesLote:1, quantidadeMinima:1,
      falhaPercent: DB.data.config.falhaPadrao,
      unidadesMesEstimadas:30, markupPadrao: DB.data.config.markupConsumidorPadrao, markupLojistaPadrao:null,
      precoKgOverride:null, impostoOverride:null, taxaCartaoOverride:null, custoAnuncioOverride:null,
      acessorios:[], obs:'', status:'ativo'
    };
    const materiais = DB.all('materiais');
    const impressoras = DB.all('impressoras');
    const acessorios = DB.all('acessorios');
    Modal.open(`
      <div class="modal-head"><h3>${id?'Editar produto':'Novo produto'}</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <form id="prod-form">
          <fieldset class="grp">
            <legend>Identificação</legend>
            <div class="form-grid c3">
              <div class="field span2"><label>Nome <span class="req">*</span></label><input required name="nome" value="${esc(p.nome)}"></div>
              <div class="field"><label>Código</label><input name="codigo" value="${esc(p.codigo)}"></div>
              <div class="field span2"><label>Descrição</label><input name="descricao" value="${esc(p.descricao)}"></div>
              <div class="field"><label>Qtd. mínima p/ produção</label><input type="number" step="1" name="quantidadeMinima" value="${p.quantidadeMinima}"></div>
            </div>
          </fieldset>
          <fieldset class="grp" style="margin-top:14px;">
            <legend>Impressão (lote)</legend>
            <div class="note-box blue" style="margin-bottom:12px;">Informe os dados do <strong>lote de impressão</strong> (uma "fornada"): peso total, tempo total e quantas peças saem dela. O custo por unidade é calculado dividindo o custo do lote pelas unidades.</div>
            <div class="form-grid c3">
              <div class="field"><label>Material</label>
                <select name="materialId">
                  <option value="">Selecione...</option>
                  ${materiais.map(m=>`<option value="${m.id}" ${p.materialId===m.id?'selected':''}>${esc(m.nome)} (${fmtBRL(m.custoKg)}/kg)</option>`).join('')}
                </select>
              </div>
              <div class="field"><label>Preço/kg específico deste produto <span class="hint">(opcional — sobrepõe o preço do material)</span></label><input type="number" step="0.01" name="precoKgOverride" value="${p.precoKgOverride!=null?p.precoKgOverride:''}"></div>
              <div class="field"><label>Impressora</label>
                <select name="impressoraId">
                  <option value="">Selecione...</option>
                  ${impressoras.map(i=>`<option value="${i.id}" ${p.impressoraId===i.id?'selected':''}>${esc(i.nome)}</option>`).join('')}
                </select>
              </div>
              <div class="field"><label>Peso do lote (g) <span class="req">*</span></label><input required type="number" step="0.1" name="pesoLoteG" value="${p.pesoLoteG}"></div>
              <div class="field"><label>Tempo do lote (HH:MM) <span class="req">*</span></label><input required type="text" name="tempoLoteHoras" value="${decimalToHHMM(p.tempoLoteHoras)}" placeholder="Ex: 04:20" pattern="[0-9]+:[0-5][0-9]"><span class="hint">horas:minutos — ex: 20 min = 00:20, 30h = 30:00</span></div>
              <div class="field"><label>Unidades por lote <span class="req">*</span></label><input required type="number" step="1" name="unidadesLote" value="${p.unidadesLote}"></div>
              <div class="field"><label>% de falhas de impressão</label><input type="number" step="0.1" name="falhaPercent" value="${(p.falhaPercent||0)*100}"></div>
              <div class="field"><label>Unidades estimadas/mês <span class="hint">(rateio de custo fixo)</span></label><input type="number" step="1" name="unidadesMesEstimadas" value="${p.unidadesMesEstimadas}"></div>
            </div>
          </fieldset>
          <fieldset class="grp" style="margin-top:14px;">
            <legend>Acessórios do produto</legend>
            <div id="prod-acessorios-list"></div>
            <button type="button" class="btn sm" style="margin-top:8px;" onclick="Produtos._addAcessorioRow()">+ Adicionar acessório</button>
          </fieldset>
          <fieldset class="grp" style="margin-top:14px;">
            <legend>Precificação padrão deste produto</legend>
            <div class="form-grid c3">
              <div class="field"><label>Markup consumidor</label><input type="number" step="0.01" name="markupPadrao" value="${p.markupPadrao!=null?p.markupPadrao:''}" placeholder="${DB.data.config.markupConsumidorPadrao}"></div>
              <div class="field"><label>Markup lojista</label><input type="number" step="0.01" name="markupLojistaPadrao" value="${p.markupLojistaPadrao!=null?p.markupLojistaPadrao:''}" placeholder="${DB.data.config.markupLojistaPadrao}"></div>
              <div class="field"><label>Status</label><select name="status"><option value="ativo" ${p.status==='ativo'?'selected':''}>Ativo</option><option value="inativo" ${p.status==='inativo'?'selected':''}>Inativo</option></select></div>
              <div class="field"><label>Imposto (%) <span class="hint">deixe vazio p/ usar padrão</span></label><input type="number" step="0.1" name="impostoOverride" value="${p.impostoOverride!=null?p.impostoOverride*100:''}"></div>
              <div class="field"><label>Tx. cartão (%)</label><input type="number" step="0.1" name="taxaCartaoOverride" value="${p.taxaCartaoOverride!=null?p.taxaCartaoOverride*100:''}"></div>
              <div class="field"><label>Custo de anúncio (%)</label><input type="number" step="0.1" name="custoAnuncioOverride" value="${p.custoAnuncioOverride!=null?p.custoAnuncioOverride*100:''}"></div>
            </div>
          </fieldset>
          <div class="field" style="margin-top:14px;"><label>Observações</label><textarea name="obs">${esc(p.obs)}</textarea></div>
        </form>
        <div class="divider-label">Prévia do cálculo</div>
        <div id="prod-preview" class="card card-pad" style="background:var(--paper);"></div>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn primary" onclick="Produtos.salvar('${p.id}', ${id?'true':'false'})">Salvar produto</button></div>
    `, {wide:true});

    Produtos._acessoriosEdicao = (p.acessorios||[]).map(a=>Object.assign({},a));
    Produtos._renderAcessorioRows();
    const form = document.getElementById('prod-form');
    form.addEventListener('input', Produtos._updatePreview);
    Produtos._updatePreview();
  },

  _addAcessorioRow(){
    const acessorios = DB.all('acessorios');
    if(!acessorios.length){ toast('Cadastre acessórios primeiro (menu Acessórios).', 'err'); return; }
    Produtos._acessoriosEdicao.push({acessorioId: acessorios[0].id, quantidade:0});
    Produtos._renderAcessorioRows();
    Produtos._updatePreview();
  },
  _removeAcessorioRow(idx){
    Produtos._acessoriosEdicao.splice(idx,1);
    Produtos._renderAcessorioRows();
    Produtos._updatePreview();
  },
  _renderAcessorioRows(){
    const acessorios = DB.all('acessorios');
    const el = document.getElementById('prod-acessorios-list');
    if(!Produtos._acessoriosEdicao.length){ el.innerHTML = `<div class="muted" style="font-size:12.5px;">Nenhum acessório adicionado.</div>`; return; }
    el.innerHTML = Produtos._acessoriosEdicao.map((a,idx)=>{
      const ac = DB.get('acessorios', a.acessorioId);
      return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
        <select style="flex:2;" class="f-input" onchange="Produtos._acessoriosEdicao[${idx}].acessorioId=this.value; Produtos._updatePreview();">
          ${acessorios.map(x=>`<option value="${x.id}" ${a.acessorioId===x.id?'selected':''}>${esc(x.nome)} (${fmtBRL(x.custoUnitario)})</option>`).join('')}
        </select>
        <input type="number" step="1" style="flex:1;" class="f-input" value="${a.quantidade}" onchange="Produtos._acessoriosEdicao[${idx}].quantidade=parseFloat(this.value)||0; Produtos._updatePreview();">
        <span class="muted" style="font-size:12px;">un.</span>
        <button type="button" class="btn sm ghost danger" onclick="Produtos._removeAcessorioRow(${idx})">&times;</button>
      </div>`;
    }).join('');
  },

  _updatePreview(){
    const form = document.getElementById('prod-form');
    if(!form) return;
    const fd = new FormData(form);
    const produto = Produtos._collect(fd);
    const material = DB.get('materiais', produto.materialId);
    const impressora = DB.get('impressoras', produto.impressoraId);
    const r = Calc.calcularProdutoCompleto({produto, material, impressora, acessoriosDb: DB.all('acessorios'), config: DB.data.config});
    document.getElementById('prod-preview').innerHTML = `
      <div class="calc-line"><span class="lbl">Custo de matéria-prima</span><span class="money">${fmtBRL(r.custoMaterial)}</span></div>
      <div class="calc-line"><span class="lbl">Custo de energia</span><span class="money">${fmtBRL(r.custoEnergia)}</span></div>
      <div class="calc-line"><span class="lbl">Custo de acessórios</span><span class="money">${fmtBRL(r.custoAcessorios)}</span></div>
      <div class="calc-line"><span class="lbl">Rateio de custo fixo</span><span class="money">${fmtBRL(r.custoFixoRateio)}</span></div>
      <div class="calc-line"><span class="lbl">Depreciação da impressora</span><span class="money">${fmtBRL(r.custoDepreciacao)}</span></div>
      <div class="calc-line"><span class="lbl">Manutenção</span><span class="money">${fmtBRL(r.custoManutencao)}</span></div>
      <div class="calc-line"><span class="lbl">Custo de falhas de impressão</span><span class="money">${fmtBRL(r.custoFalhas)}</span></div>
      <div class="calc-line total"><span class="lbl">Custo total do lote</span><span class="money">${fmtBRL(r.custoTotalLote)}</span></div>
      <div class="calc-line total"><span class="lbl">Custo unitário</span><span class="money">${fmtBRL(r.custoUnitario)}</span></div>
      <div class="hr"></div>
      <div class="calc-line"><span class="lbl">Preço consumidor (markup ${fmtNum(r.markupConsumidor,2)})</span><span class="money pos">${fmtBRL(r.precoConsumidor)}</span></div>
      <div class="calc-line"><span class="lbl">Lucro líquido consumidor / margem</span><span class="money pos">${fmtBRL(r.lucroLiquidoConsumidor)} · ${fmtPct(r.margemConsumidor*100)}</span></div>
      <div class="calc-line"><span class="lbl">Preço lojista (markup ${fmtNum(r.markupLojista,2)})</span><span class="money">${fmtBRL(r.precoLojista)}</span></div>
      <div class="calc-line"><span class="lbl">Lucro líquido lojista / margem</span><span class="money">${fmtBRL(r.lucroLiquidoLojista)} · ${fmtPct(r.margemLojista*100)}</span></div>
    `;
  },

  _collect(fd){
    const num = (k)=> fd.get(k)==='' || fd.get(k)==null ? null : parseFloat(fd.get(k));
    return {
      nome: fd.get('nome')||'', codigo: fd.get('codigo')||'', descricao: fd.get('descricao')||'',
      materialId: fd.get('materialId')||'', impressoraId: fd.get('impressoraId')||'',
      pesoLoteG: parseFloat(fd.get('pesoLoteG'))||0, tempoLoteHoras: hhmmToDecimal(fd.get('tempoLoteHoras')),
      unidadesLote: parseFloat(fd.get('unidadesLote'))||1, quantidadeMinima: parseFloat(fd.get('quantidadeMinima'))||1,
      falhaPercent: (parseFloat(fd.get('falhaPercent'))||0)/100,
      unidadesMesEstimadas: parseFloat(fd.get('unidadesMesEstimadas'))||1,
      markupPadrao: num('markupPadrao'), markupLojistaPadrao: num('markupLojistaPadrao'),
      precoKgOverride: num('precoKgOverride'),
      impostoOverride: fd.get('impostoOverride')==='' ? null : (parseFloat(fd.get('impostoOverride'))||0)/100,
      taxaCartaoOverride: fd.get('taxaCartaoOverride')==='' ? null : (parseFloat(fd.get('taxaCartaoOverride'))||0)/100,
      custoAnuncioOverride: fd.get('custoAnuncioOverride')==='' ? null : (parseFloat(fd.get('custoAnuncioOverride'))||0)/100,
      acessorios: Produtos._acessoriosEdicao,
      obs: fd.get('obs')||'', status: fd.get('status')||'ativo'
    };
  },

  salvar(id, isEdit){
    const form = document.getElementById('prod-form');
    const fd = new FormData(form);
    if(!fd.get('nome') || !fd.get('nome').trim()){ toast('Informe o nome do produto.', 'err'); return; }
    const collected = Produtos._collect(fd);
    const p = Object.assign({id}, collected);
    DB.upsert('produtos', p);
    Modal.close(); toast('Produto salvo com sucesso.', 'ok'); 
    if(App.route==='produtos') Produtos.renderTable();
  },

  excluir(id){
    const emUso = DB.all('orcamentos').some(o=>(o.itens||[]).some(it=>it.produtoId===id));
    const msg = emUso ? 'Este produto está usado em orçamentos existentes (que manterão os valores já registrados). Excluir mesmo assim?' : 'Deseja realmente excluir este produto?';
    confirmAction(msg, ()=>{ DB.remove('produtos', id); toast('Produto excluído.', 'ok'); Produtos.renderTable(); });
  }
};

Views.precificacao = function(param){
  const content = document.getElementById('content');
  const produtos = DB.all('produtos');
  content.innerHTML = `
    <div class="grid cols-2" style="align-items:start;">
      <div class="card card-pad">

        </select></div>
        <div id="prec-editor" style="margin-top:16px;"></div>
      </div>

const Precificacao = {
  abrir(produtoId){ App.goto('precificacao', produtoId); },
  load(){
    const id = document.getElementById('prec-produto').value;
    if(!id){ document.getElementById('prec-editor').innerHTML=''; document.getElementById('prec-result').innerHTML=''; return; }
    const p = DB.get('produtos', id);
    const cfg = DB.data.config;
    document.getElementById('prec-editor').innerHTML = `
      <div class="form-grid">
        <div class="field"><label>Markup consumidor</label><input id="pr-markup-c" type="number" step="0.01" class="f-input" value="${p.markupPadrao!=null?p.markupPadrao:cfg.markupConsumidorPadrao}"></div>
        <div class="field"><label>Markup lojista</label><input id="pr-markup-l" type="number" step="0.01" class="f-input" value="${p.markupLojistaPadrao!=null?p.markupLojistaPadrao:cfg.markupLojistaPadrao}"></div>
        <div class="field"><label>Imposto (%)</label><input id="pr-imposto" type="number" step="0.1" class="f-input" value="${(p.impostoOverride!=null?p.impostoOverride:cfg.impostoPadrao)*100}"></div>
        <div class="field"><label>Tx. cartão (%)</label><input id="pr-cartao" type="number" step="0.1" class="f-input" value="${(p.taxaCartaoOverride!=null?p.taxaCartaoOverride:cfg.taxaCartaoPadrao)*100}"></div>
        <div class="field"><label>Custo de anúncio (%)</label><input id="pr-anuncio" type="number" step="0.1" class="f-input" value="${(p.custoAnuncioOverride!=null?p.custoAnuncioOverride:cfg.custoAnuncioPadrao)*100}"></div>
      </div>
      <div class="pill-row" style="margin-top:12px;">
        <button class="btn sm" onclick="Precificacao.salvarNoProduto('${p.id}')">Salvar como padrão deste produto</button>
      </div>
    `;
    ['pr-markup-c','pr-markup-l','pr-imposto','pr-cartao','pr-anuncio'].forEach(id2=>document.getElementById(id2).addEventListener('input', Precificacao.update));
    Precificacao.update();
  },
  update(){
    const id = document.getElementById('prec-produto').value;
    const p = DB.get('produtos', id);
    if(!p) return;
    const material = DB.get('materiais', p.materialId);
    const impressora = DB.get('impressoras', p.impressoraId);
    const produtoSim = Object.assign({}, p, {
      markupPadrao: parseFloat(document.getElementById('pr-markup-c').value)||0,
      markupLojistaPadrao: parseFloat(document.getElementById('pr-markup-l').value)||0,
      impostoOverride: (parseFloat(document.getElementById('pr-imposto').value)||0)/100,
      taxaCartaoOverride: (parseFloat(document.getElementById('pr-cartao').value)||0)/100,
      custoAnuncioOverride: (parseFloat(document.getElementById('pr-anuncio').value)||0)/100
    });
    const r = Calc.calcularProdutoCompleto({produto:produtoSim, material, impressora, acessoriosDb: DB.all('acessorios'), config: DB.data.config});
    document.getElementById('prec-result').innerHTML = `
      <div class="section-title">${esc(p.nome)}</div>
      <div class="calc-line"><span class="lbl">Custo unitário</span><span class="money">${fmtBRL(r.custoUnitario)}</span></div>
      <div class="hr"></div>
      <div style="font-weight:800;font-size:12.5px;color:var(--navy-2);margin-bottom:6px;">CONSUMIDOR FINAL</div>
      <div class="calc-line"><span class="lbl">Markup</span><span class="num">${fmtNum(r.markupConsumidor,2)}x</span></div>
      <div class="calc-line"><span class="lbl">Preço unitário</span><span class="money pos">${fmtBRL(r.precoConsumidor)}</span></div>
      <div class="calc-line"><span class="lbl">Impostos/taxas</span><span class="money">${fmtBRL(r.precoConsumidor - r.custoUnitario - r.lucroLiquidoConsumidor)}</span></div>
      <div class="calc-line"><span class="lbl">Lucro bruto</span><span class="money">${fmtBRL(r.lucroBrutoConsumidor)}</span></div>
      <div class="calc-line total"><span class="lbl">Lucro líquido</span><span class="money pos">${fmtBRL(r.lucroLiquidoConsumidor)}</span></div>
      <div class="calc-line"><span class="lbl">Margem</span><span class="num">${fmtPct(r.margemConsumidor*100)}</span></div>
      <div class="hr"></div>
      <div style="font-weight:800;font-size:12.5px;color:var(--navy-2);margin-bottom:6px;">LOJISTA</div>
      <div class="calc-line"><span class="lbl">Markup</span><span class="num">${fmtNum(r.markupLojista,2)}x</span></div>
      <div class="calc-line"><span class="lbl">Preço unitário</span><span class="money">${fmtBRL(r.precoLojista)}</span></div>
      <div class="calc-line"><span class="lbl">Lucro bruto</span><span class="money">${fmtBRL(r.lucroBrutoLojista)}</span></div>
      <div class="calc-line total"><span class="lbl">Lucro líquido</span><span class="money">${fmtBRL(r.lucroLiquidoLojista)}</span></div>
      <div class="calc-line"><span class="lbl">Margem</span><span class="num">${fmtPct(r.margemLojista*100)}</span></div>
    `;
  },
  salvarNoProduto(id){
    const p = DB.get('produtos', id);
    if(!p) return;
    p.markupPadrao = parseFloat(document.getElementById('pr-markup-c').value)||0;
    p.markupLojistaPadrao = parseFloat(document.getElementById('pr-markup-l').value)||0;
    p.impostoOverride = (parseFloat(document.getElementById('pr-imposto').value)||0)/100;
    p.taxaCartaoOverride = (parseFloat(document.getElementById('pr-cartao').value)||0)/100;
    p.custoAnuncioOverride = (parseFloat(document.getElementById('pr-anuncio').value)||0)/100;
    DB.upsert('produtos', p);
    toast('Precificação salva no produto.', 'ok');
  }
};

/* ============================================================
   ORÇAMENTOS
   ============================================================ */
const Orcamentos = {
  STATUSES: [
    {id:'rascunho', label:'Rascunho', color:'#8C99A6'},
    {id:'enviado', label:'Enviado', color:'#2765A6'},
    {id:'aguardando_aprovacao', label:'Aguardando aprovação', color:'#C58A1F'},
    {id:'aprovado', label:'Aprovado', color:'#1C9C6B'},
    {id:'em_producao', label:'Em produção', color:'#F2683C'},
    {id:'concluido', label:'Concluído', color:'#2765A6'},
    {id:'pago', label:'Pago', color:'#1C9C6B'},
    {id:'cancelado', label:'Cancelado', color:'#D6473C'},
    {id:'perdido', label:'Perdido', color:'#D6473C'}
  ],
  statusBadge(id){
    const s = Orcamentos.STATUSES.find(x=>x.id===id) || Orcamentos.STATUSES[0];
    const map = {rascunho:'gray',enviado:'blue',aguardando_aprovacao:'amber',aprovado:'green',em_producao:'orange',concluido:'blue',pago:'green',cancelado:'red',perdido:'red'};
    return `<span class="badge ${map[id]||'gray'}">${s.label}</span>`;
  },

  proximoNumero(){
    DB.data.contador.orcamento = (DB.data.contador.orcamento||0) + 1;
    DB.save();
    return String(DB.data.contador.orcamento).padStart(4,'0');
  },

  _draft: null,

  novo(clienteId){
    const cfg = DB.data.config;
    const numero = Orcamentos.proximoNumero();
    // não persiste ainda: o número só é confirmado ao salvar; se cancelar, o número fica "pulado" (comportamento aceitável e comum em sistemas de orçamento)
    Orcamentos._draft = {
      id: uid(), numero, clienteId: clienteId||'', data: todayISO(),
      validade: addDaysISO(todayISO(), cfg.validadeOrcamentoDias),
      prazoProducaoDias: cfg.prazoPadraoDias,
      tipoPreco: 'consumidor', condicaoPagamento: cfg.condicoesPagamentoPadrao,
      observacoes: '', status: 'rascunho',
      itens: [], desconto:{tipo:'valor', valor:0}, frete:0, tipoEntrega:'A combinar',
      fechado: false, dataFechamento: null,
      criadoEm: nowISO(), atualizadoEm: nowISO(), dataAprovacao: null
    };
    Orcamentos._novoEdit = true;
    Orcamentos.abrirEditor();
  },

  abrir(id){
    const o = DB.get('orcamentos', id);
    if(!o) return;
    Orcamentos._draft = JSON.parse(JSON.stringify(o));
    Orcamentos._novoEdit = false;
    Orcamentos.abrirEditor();
  },

  duplicar(id){
    const o = DB.get('orcamentos', id);
    if(!o) return;
    const cfg = DB.data.config;
    const novo = JSON.parse(JSON.stringify(o));
    novo.id = uid();
    novo.numero = Orcamentos.proximoNumero();
    novo.data = todayISO();
    novo.validade = addDaysISO(todayISO(), cfg.validadeOrcamentoDias);
    novo.status = 'rascunho';
    novo.dataAprovacao = null;
    novo.fechado = false;
    novo.dataFechamento = null;
    novo.criadoEm = nowISO();
    novo.atualizadoEm = nowISO();
    Orcamentos._draft = novo;
    Orcamentos._novoEdit = true;
    Orcamentos.abrirEditor();
    toast('Orçamento duplicado — revise e salve.', 'ok');
  },

  abrirEditor(){
    const o = Orcamentos._draft;
    const clientes = DB.all('clientes').filter(c=>c.status!=='inativo').concat(DB.all('clientes').filter(c=>c.status==='inativo'));
    Modal.open(`
      <div class="modal-head"><h3>Orçamento #${o.numero}</h3><button onclick="Orcamentos.fecharEditor()">&times;</button></div>
      <div class="modal-body">
        <fieldset class="grp">
          <legend>Cliente</legend>
          <div style="display:flex;gap:8px;align-items:flex-end;">
            <div class="field" style="flex:1;"><label>Cliente <span class="req">*</span></label>
              <select id="orc-cliente" class="f-input" style="width:100%;">
                <option value="">Selecione...</option>
                ${clientes.map(c=>`<option value="${c.id}" ${o.clienteId===c.id?'selected':''}>${esc(c.nome)}${c.status==='inativo'?' (inativo)':''}</option>`).join('')}
              </select>
            </div>
            <button type="button" class="btn" onclick="Orcamentos.novoClienteInline()">+ Novo cliente</button>
          </div>
        </fieldset>

        <fieldset class="grp" style="margin-top:14px;">
          <legend>Dados do orçamento</legend>
          <div class="form-grid c3">
            <div class="field"><label>Data</label><input type="date" id="orc-data" class="f-input" value="${o.data}"></div>
            <div class="field"><label>Validade</label><input type="date" id="orc-validade" class="f-input" value="${o.validade}"></div>
            <div class="field"><label>Prazo de produção (dias)</label><input type="number" id="orc-prazo" class="f-input" value="${o.prazoProducaoDias}"></div>
            <div class="field"><label>Tipo de preço</label>
              <select id="orc-tipopreco" class="f-input">
                <option value="consumidor" ${o.tipoPreco==='consumidor'?'selected':''}>Consumidor final</option>
                <option value="lojista" ${o.tipoPreco==='lojista'?'selected':''}>Lojista</option>
              </select>
            </div>
            <div class="field span2"><label>Condição de pagamento</label>
              <div class="pill-row" style="margin-bottom:6px;">
