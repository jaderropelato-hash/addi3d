    ['orc-data','orc-validade','orc-prazo','orc-tipopreco','orc-condicao','orc-entrega','orc-status','orc-desc-tipo','orc-desc-valor','orc-frete','orc-obs','orc-fechado','orc-datafechamento'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', Orcamentos.syncDraft);
      if(el) el.addEventListener('change', Orcamentos.syncDraft);
    });
    document.getElementById('orc-tipopreco').addEventListener('change', Orcamentos.recalcularTipoPreco);
    document.getElementById('orc-fechado').addEventListener('change', (e)=>{
      document.getElementById('orc-datafechamento-wrap').style.display = e.target.checked ? '' : 'none';
      Orcamentos.syncDraft();
    });
    Orcamentos.renderItens();
  },

  fecharEditor(){ Orcamentos._draft = null; Modal.close(); if(App.route==='orcamentos') Orcamentos.renderTable(); },

  _addCondicao(texto){
    const input = document.getElementById('orc-condicao');
    const atual = input.value.trim();
    if(atual.includes(texto)) return;
    input.value = atual ? (atual + ' / ' + texto) : texto;
    Orcamentos.syncDraft();
  },

  novoClienteInline(){
    Clientes.abrirForm();
    // após salvar o cliente no form padrão, o select do orçamento é atualizado manualmente pelo usuário reabrindo;
    // para fluidez, sobrescrevemos o botão salvar do form de cliente para religar ao orçamento
    const saveBtn = document.querySelector('.modal-foot .btn.primary');
  },

  syncDraft(){
    const o = Orcamentos._draft;
    o.clienteId = document.getElementById('orc-cliente').value;
    o.data = document.getElementById('orc-data').value;
    o.validade = document.getElementById('orc-validade').value;
    o.prazoProducaoDias = parseFloat(document.getElementById('orc-prazo').value)||0;
    o.condicaoPagamento = document.getElementById('orc-condicao').value;
    o.tipoEntrega = document.getElementById('orc-entrega').value;
    o.status = document.getElementById('orc-status').value;
    o.desconto.tipo = document.getElementById('orc-desc-tipo').value;
    o.desconto.valor = parseFloat(document.getElementById('orc-desc-valor').value)||0;
    o.frete = parseFloat(document.getElementById('orc-frete').value)||0;
    o.observacoes = document.getElementById('orc-obs').value;
    if(o.status==='aprovado' && !o.dataAprovacao) o.dataAprovacao = todayISO();
    o.fechado = document.getElementById('orc-fechado').checked;
    o.dataFechamento = o.fechado ? (document.getElementById('orc-datafechamento').value || todayISO()) : null;
    Orcamentos.renderTotais();
  },

  addItem(){
    const produtoId = document.getElementById('orc-add-produto').value;
    if(!produtoId){ toast('Selecione um produto.', 'err'); return; }
    const produto = DB.get('produtos', produtoId);
    const r = Produtos.calcular(produto);
    const o = Orcamentos._draft;
    const tipoPreco = document.getElementById('orc-tipopreco').value;
    const markup = tipoPreco==='lojista' ? r.markupLojista : r.markupConsumidor;
    const precoUnitario = tipoPreco==='lojista' ? r.precoLojista : r.precoConsumidor;
    o.itens.push({
      id: uid(), produtoId: produto.id, produtoNome: produto.nome, produtoCodigo: produto.codigo,
      quantidade: produto.quantidadeMinima||1,
      custoUnitarioSnapshot: round2(r.custoUnitario),
      custoAcessoriosUnitarioSnapshot: round2(r.custoAcessoriosUnitario),
      markupSnapshot: markup,
      precoUnitarioSnapshot: round2(precoUnitario),
      impostoSnapshot: r.imposto, taxaCartaoSnapshot: r.taxaCartao, custoAnuncioSnapshot: r.custoAnuncio,
      impressoraIdSnapshot: produto.impressoraId||null,
      custoDepreciacaoUnitarioSnapshot: produto.unidadesLote>0 ? round2(r.custoDepreciacao/produto.unidadesLote) : 0
    });
    document.getElementById('orc-add-produto').value = '';
    Orcamentos.renderItens();
  },

  recalcularTipoPreco(){
    // ao trocar consumidor/lojista, recalcula o preço/markup padrão dos itens já adicionados
    const o = Orcamentos._draft;
    const tipoPreco = document.getElementById('orc-tipopreco').value;
    o.itens.forEach(it=>{
      const produto = DB.get('produtos', it.produtoId);
      if(!produto) return;
      const r = Produtos.calcular(produto);
      it.markupSnapshot = tipoPreco==='lojista' ? r.markupLojista : r.markupConsumidor;
      it.precoUnitarioSnapshot = round2(tipoPreco==='lojista' ? r.precoLojista : r.precoConsumidor);
      it.custoAcessoriosUnitarioSnapshot = round2(r.custoAcessoriosUnitario);
    });
    Orcamentos.syncDraft();
    Orcamentos.renderItens();
  },

  removeItem(itemId){
    Orcamentos._draft.itens = Orcamentos._draft.itens.filter(i=>i.id!==itemId);
    Orcamentos.renderItens();
  },

  updateItemQtd(itemId, val){
    const it = Orcamentos._draft.itens.find(i=>i.id===itemId);
    if(it){ it.quantidade = parseFloat(val)||0; Orcamentos.renderTotais(); }
  },
  updateItemMarkup(itemId, val){
    const it = Orcamentos._draft.itens.find(i=>i.id===itemId);
    if(it){
      const custoAcess = it.custoAcessoriosUnitarioSnapshot||0;
      const custoBase = it.custoUnitarioSnapshot - custoAcess;
      it.markupSnapshot = parseFloat(val)||0;
      // markup incide só sobre o custo sem acessórios/insumos; acessórios são somados por fora, sem multiplicar
      it.precoUnitarioSnapshot = round2(custoBase * it.markupSnapshot + custoAcess);
      Orcamentos.renderItens();
    }
  },
  updateItemPreco(itemId, val){
    const it = Orcamentos._draft.itens.find(i=>i.id===itemId);
    if(it){
      const custoAcess = it.custoAcessoriosUnitarioSnapshot||0;
      const custoBase = it.custoUnitarioSnapshot - custoAcess;
      it.precoUnitarioSnapshot = parseFloat(val)||0;
      it.markupSnapshot = custoBase>0 ? round2((it.precoUnitarioSnapshot - custoAcess)/custoBase) : 0;
      Orcamentos.renderItens();
    }
  },

  renderItens(){
    const o = Orcamentos._draft;
    const el = document.getElementById('orc-itens-table');
    if(!o.itens.length){ el.innerHTML = `<div class="tbl-empty">Nenhum produto adicionado ainda.</div>`; Orcamentos.renderTotais(); return; }
    el.innerHTML = `<div class="tbl-wrap" style="box-shadow:none;"><table class="tbl"><thead><tr>
      <th>Produto</th><th>Qtd.</th><th>Custo un.</th><th>Markup</th><th>Preço un.</th><th>Total</th><th></th>
    </tr></thead><tbody>
      ${o.itens.map(it=>{
        const total = Calc.calcularTotalItem(it.quantidade, it.precoUnitarioSnapshot);
        return `<tr>
          <td>${esc(it.produtoNome)}</td>
          <td><input type="number" step="1" style="width:70px;" class="f-input" value="${it.quantidade}" onchange="Orcamentos.updateItemQtd('${it.id}', this.value)"></td>
          <td class="money">${fmtBRL(it.custoUnitarioSnapshot)}</td>
          <td><input type="number" step="0.01" style="width:70px;" class="f-input" value="${fmtNum(it.markupSnapshot,2)}" onchange="Orcamentos.updateItemMarkup('${it.id}', this.value)"></td>
          <td><input type="number" step="0.01" style="width:90px;" class="f-input money" value="${it.precoUnitarioSnapshot}" onchange="Orcamentos.updateItemPreco('${it.id}', this.value)"></td>
          <td class="money">${fmtBRL(total)}</td>
          <td><button type="button" class="btn sm ghost danger" onclick="Orcamentos.removeItem('${it.id}')">&times;</button></td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
    Orcamentos.renderTotais();
  },

  computeTotais(){
    const o = Orcamentos._draft;
    const totalsBase = Calc.calcularTotalPedido(o.itens.map(i=>({quantidade:i.quantidade, precoUnitario:i.precoUnitarioSnapshot})), o.desconto, o.frete);
    let custoTotal = 0, lucroEstimado = 0;
    o.itens.forEach(it=>{
      const custoItem = it.custoUnitarioSnapshot * it.quantidade;
      const lucroBrutoItem = (it.precoUnitarioSnapshot - it.custoUnitarioSnapshot) * it.quantidade;
      const lucroLiquidoItem = Calc.calcularLucroLiquido(lucroBrutoItem, it.impostoSnapshot||0, it.taxaCartaoSnapshot||0, it.custoAnuncioSnapshot||0);
      custoTotal += custoItem;
      lucroEstimado += lucroLiquidoItem;
    });
    return Object.assign({}, totalsBase, {custoTotal, lucroEstimado, margem: totalsBase.total>0 ? lucroEstimado/totalsBase.total : 0});
  },

  renderTotais(){
    const t = Orcamentos.computeTotais();
    const el = document.getElementById('orc-totais');
    if(!el) return;
    el.innerHTML = `
      <div class="grid cols-2">
        <div class="card card-pad" style="background:var(--paper);">
          <div style="font-size:11px;font-weight:800;color:var(--ink-faint);text-transform:uppercase;margin-bottom:8px;">Resumo comercial (visível ao cliente)</div>
          <div class="calc-line"><span class="lbl">Subtotal</span><span class="money">${fmtBRL(t.subtotal)}</span></div>
          <div class="calc-line"><span class="lbl">Desconto</span><span class="money">- ${fmtBRL(t.desconto)}</span></div>
          <div class="calc-line"><span class="lbl">Frete</span><span class="money">${fmtBRL(t.frete)}</span></div>
          <div class="calc-line total"><span class="lbl">Total do pedido</span><span class="money pos">${fmtBRL(t.total)}</span></div>
        </div>
        <div class="card card-pad" style="background:#FFF7F4;">
          <div style="font-size:11px;font-weight:800;color:var(--orange-dark);text-transform:uppercase;margin-bottom:8px;">Interno — não aparece no documento do cliente</div>
          <div class="calc-line"><span class="lbl">Custo total dos itens</span><span class="money">${fmtBRL(t.custoTotal)}</span></div>
          <div class="calc-line"><span class="lbl">Lucro líquido estimado</span><span class="money pos">${fmtBRL(t.lucroEstimado)}</span></div>
          <div class="calc-line total"><span class="lbl">Margem sobre o total</span><span class="num">${fmtPct(t.margem*100)}</span></div>
        </div>
      </div>
    `;
  },

  duplicarAtual(){
    Orcamentos.salvar(false, ()=>{ Orcamentos.duplicar(Orcamentos._draft.id); });
  },

  salvar(gerarDocumento, callback){
    const o = Orcamentos._draft;
    Orcamentos.syncDraft();
    if(!o.clienteId){ toast('Selecione um cliente.', 'err'); return; }
    if(!o.itens.length){ toast('Adicione ao menos um produto ao orçamento.', 'err'); return; }
    const anterior = DB.get('orcamentos', o.id);
    o.totais = Orcamentos.computeTotais();
    o.atualizadoEm = nowISO();
    if(!o.criadoEm) o.criadoEm = nowISO();
    DB.upsert('orcamentos', o);

    // ajusta automaticamente o saldo de caixa conforme o pedido é fechado, reaberto, ou tem o valor alterado
    const eraFechado = anterior ? !!anterior.fechado : false;
    const agoraFechado = !!o.fechado;
    const valorAnterior = anterior?.totais?.total || 0;
    const valorAtual = o.totais.total || 0;
    if(!eraFechado && agoraFechado){
      Financeiro.ajustarCaixa(valorAtual, `Pedido #${o.numero} fechado`);
    } else if(eraFechado && !agoraFechado){
      Financeiro.ajustarCaixa(-valorAnterior, `Pedido #${o.numero} reaberto`);
    } else if(eraFechado && agoraFechado && valorAnterior !== valorAtual){
      Financeiro.ajustarCaixa(valorAtual - valorAnterior, `Pedido #${o.numero} atualizado`);
    }

    toast('Orçamento salvo com sucesso.', 'ok');
    if(callback){ callback(); return; }
    if(gerarDocumento){ Orcamentos.gerarDocumento(o.id); }
    else { Orcamentos.fecharEditor(); }
  },

  excluir(id){
    confirmAction('Deseja realmente excluir este orçamento? Esta ação não pode ser desfeita.', ()=>{
      const o = DB.get('orcamentos', id);
      if(o && o.fechado){
        Financeiro.ajustarCaixa(-(o.totais?.total||0), `Pedido #${o.numero} excluído`);
      }
      DB.remove('orcamentos', id); toast('Orçamento excluído.', 'ok'); Orcamentos.renderTable();
    });
  }
};

Orcamentos.renderTable = function(){
  const q = (document.getElementById('orc-search')?.value||'').toLowerCase();
  const st = document.getElementById('orc-filter-status')?.value||'';
  const de = document.getElementById('orc-filter-de')?.value||'';
  const ate = document.getElementById('orc-filter-ate')?.value||'';
  let list = DB.all('orcamentos').filter(o=>{
    const cli = DB.get('clientes', o.clienteId);
    const prodNames = (o.itens||[]).map(i=>i.produtoNome).join(' ');
    const okQ = !q || [cli?cli.nome:'', o.numero, prodNames].join(' ').toLowerCase().includes(q);
    const okS = !st || o.status===st;
    const okDe = !de || (o.data && o.data>=de);
    const okAte = !ate || (o.data && o.data<=ate);
    return okQ && okS && okDe && okAte;
  }).sort((a,b)=>(b.criadoEm||'').localeCompare(a.criadoEm||''));
  const el = document.getElementById('orc-list-table');
  if(!list.length){ el.innerHTML = `<div class="card"><div class="empty-state"><div class="big">&#128196;</div><h4>Nenhum orçamento encontrado</h4><p>Crie seu primeiro orçamento para um cliente.</p><button class="btn primary" onclick="Orcamentos.novo()">+ Novo orçamento</button></div></div>`; return; }
  el.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>
    <th>Número</th><th>Cliente</th><th>Data</th><th>Itens</th><th>Valor</th><th>Lucro estimado</th><th>Status</th><th></th>
  </tr></thead><tbody>
    ${list.map(o=>{
      const cli = DB.get('clientes', o.clienteId);
      return `<tr>
        <td class="num" style="cursor:pointer;" onclick="Orcamentos.abrir('${o.id}')"><strong>#${o.numero}</strong></td>
        <td style="cursor:pointer;" onclick="Orcamentos.abrir('${o.id}')">${esc(cli?cli.nome:'— cliente removido —')}</td>
        <td>${fmtDateBR(o.data)}</td>
        <td>${(o.itens||[]).length}</td>
        <td class="money">${fmtBRL(o.totais?.total||0)}</td>
        <td class="money pos">${fmtBRL(o.totais?.lucroEstimado||0)}</td>
        <td>${Orcamentos.statusBadge(o.status)}</td>
        <td class="row-actions">
          <button class="btn sm" onclick="Orcamentos.gerarDocumento('${o.id}')">Gerar</button>
          <button class="btn sm ghost" onclick="Orcamentos.abrir('${o.id}')">Editar</button>
          <button class="btn sm ghost" onclick="Orcamentos.duplicar('${o.id}')">Duplicar</button>
          <button class="btn sm danger ghost" onclick="Orcamentos.excluir('${o.id}')">Excluir</button>
        </td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
};

/* ---------------- DOCUMENTO DO ORÇAMENTO (versão cliente / impressão) ---------------- */
Orcamentos.gerarDocumento = function(id){
  const o = DB.get('orcamentos', id);
  if(!o) return;
  const cli = DB.get('clientes', o.clienteId);
  const cfg = DB.data.config;
  const itensHtml = (o.itens||[]).map(it=>`
    <tr>
      <td>${esc(it.produtoNome)}${it.produtoCodigo?`<div style="font-size:10.5px;color:#8C99A6;">${esc(it.produtoCodigo)}</div>`:''}</td>
      <td style="text-align:center;">${it.quantidade}</td>
      <td style="text-align:right;">${fmtBRL(it.precoUnitarioSnapshot)}</td>
      <td style="text-align:right;">${fmtBRL(it.quantidade*it.precoUnitarioSnapshot)}</td>
    </tr>`).join('');
  const t = o.totais || Orcamentos.computeTotais.call({_draft:o});
  const html = `
    <div style="max-width:760px;margin:0 auto;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1C2733;padding:36px 30px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0A121D;padding-bottom:18px;margin-bottom:22px;">
        <div style="display:flex;gap:12px;align-items:center;">

Orcamentos._capturarDocRender = function(){
  if(typeof html2canvas === 'undefined'){
    toast('Não foi possível carregar a ferramenta de exportação. Verifique sua conexão com a internet e tente novamente.', 'err');
    return Promise.reject(new Error('html2canvas indisponível'));
  }
  const el = document.getElementById('orc-doc-render');
  return html2canvas(el, {scale:2, backgroundColor:'#ffffff', useCORS:true});
};

Orcamentos.baixarPNG = function(numero){
  toast('Gerando PNG...', '');
  Orcamentos._capturarDocRender().then(canvas=>{
    const link = document.createElement('a');
    link.download = `ORC_ADDI3D_${numero}.png`;
    link.href = canvas.toDataURL('image/png');
    document.body.appendChild(link); link.click(); link.remove();
    toast('PNG baixado.', 'ok');
  }).catch(()=>{});
};

Orcamentos.baixarPDF = function(numero){
  if(typeof window.jspdf === 'undefined'){
    toast('Não foi possível carregar a ferramenta de exportação. Verifique sua conexão com a internet e tente novamente.', 'err');
    return;
  }
  toast('Gerando PDF...', '');
  Orcamentos._capturarDocRender().then(canvas=>{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL('image/png');

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`ORC_ADDI3D_${numero}.pdf`);
    toast('PDF baixado.', 'ok');
  }).catch(()=>{});
};

Views.relatorios = function(){
  const content = document.getElementById('content');
  const orcs = DB.all('orcamentos');
  const porStatus = Orcamentos.STATUSES.map(s=>({...s, n:orcs.filter(o=>o.status===s.id).length, v:orcs.filter(o=>o.status===s.id).reduce((a,o)=>a+(o.totais?.total||0),0)}));

  const porCliente = {};
  orcs.forEach(o=>{
    const cli = DB.get('clientes', o.clienteId);
    const nome = cli ? cli.nome : '— removido —';
    porCliente[nome] = (porCliente[nome]||0) + (o.totais?.total||0);
  });
  const topClientes = Object.entries(porCliente).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const porProduto = {};

  const totalVendido = orcs.filter(o=>o.status==='pago').reduce((s,o)=>s+(o.totais?.total||0),0);
  const totalLucro = orcs.filter(o=>o.status==='pago').reduce((s,o)=>s+(o.totais?.lucroEstimado||0),0);
  const totalOrcado = orcs.reduce((s,o)=>s+(o.totais?.total||0),0);

  content.innerHTML = `
    <div class="grid cols-3" style="margin-bottom:18px;">
      <div class="kpi"><div class="label">Total já orçado (todos)</div><div class="value">${fmtBRL(totalOrcado)}</div></div>

        <div class="section-title">Orçamentos por status</div>
        <div class="tbl-wrap" style="box-shadow:none;margin-top:10px;"><table class="tbl"><thead><tr><th>Status</th><th>Qtd.</th><th>Valor</th></tr></thead><tbody>
          ${porStatus.map(s=>`<tr><td>${s.label}</td><td>${s.n}</td><td class="money">${fmtBRL(s.v)}</td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <div class="card card-pad">
        <div class="section-title">Top clientes (valor total)</div>
        <div class="tbl-wrap" style="box-shadow:none;margin-top:10px;">
          ${topClientes.length ? `<table class="tbl"><thead><tr><th>Cliente</th><th>Valor</th></tr></thead><tbody>
          ${topClientes.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="money">${fmtBRL(v)}</td></tr>`).join('')}</tbody></table>` : `<div class="tbl-empty">Sem dados ainda.</div>`}
        </div>
      </div>
    </div>
    <div class="card card-pad" style="margin-top:16px;">
      <div class="section-title">Produtos mais orçados (unidades)</div>
      <div class="tbl-wrap" style="box-shadow:none;margin-top:10px;">
        ${topProdutos.length ? `<table class="tbl"><thead><tr><th>Produto</th><th>Unidades orçadas</th></tr></thead><tbody>

    a.href = url; a.download = `addi3d_dados.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('Backup exportado — substitua o arquivo na pasta compartilhada.', 'ok');

  exportarCSV(col){
    const rows = DB.all(col);
    if(!rows.length){ toast('Nenhum dado para exportar.', 'err'); return; }
    const keys = Array.from(rows.reduce((set,r)=>{ Object.keys(r).forEach(k=>{ if(typeof r[k] !== 'object') set.add(k); }); return set; }, new Set()));
    const csv = [keys.join(';')].concat(rows.map(r=>keys.map(k=>{
      let v = r[k]; if(v===undefined||v===null) v='';
      v = String(v).replace(/;/g,',').replace(/\n/g,' ');
      return v;
    }).join(';'))).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${col}_${todayISO()}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast('CSV exportado.', 'ok');
  }

Orcamentos._ahMaterialChange = function(){
  const matId = document.getElementById('ah-material').value;
  const mat = DB.get('materiais', matId);
  if(mat){ document.getElementById('ah-precokg').value = mat.custoKg; document.getElementById('ah-material-alert').innerHTML=''; }
  Orcamentos._ahUpdatePreview();
};

Orcamentos._ahToggleEditPreco = function(){
  const input = document.getElementById('ah-precokg');
  const alertEl = document.getElementById('ah-material-alert');
  const matId = document.getElementById('ah-material').value;
  if(!matId){ toast('Selecione um material primeiro.', 'err'); return; }
  input.readOnly = false;
  input.style.background = '#fff';
  input.focus();
  alertEl.innerHTML = `<div class="note-box" style="margin-top:8px;">
    Digite o novo preço por kg e confirme.
    <div style="margin-top:8px;"><button type="button" class="btn sm navy" onclick="Orcamentos._ahConfirmarNovoPreco()">Confirmar novo preço no cadastro</button></div>
  </div>`;
};

Orcamentos._ahConfirmarNovoPreco = function(){
  const matId = document.getElementById('ah-material').value;
  const mat = DB.get('materiais', matId);
  const novoPreco = parseFloat(document.getElementById('ah-precokg').value)||0;
  if(!mat || novoPreco<=0){ toast('Preço inválido.', 'err'); return; }
  mat.precoRolo = novoPreco * (mat.pesoRolo||1);
  mat.custoKg = novoPreco;
  mat.dataAtualizacaoPreco = todayISO();
  DB.upsert('materiais', mat);
  const input = document.getElementById('ah-precokg');
  input.readOnly = true; input.style.background = '#F2F3F5';
  document.getElementById('ah-material-alert').innerHTML = `<div class="note-box" style="margin-top:8px;">Material atualizado ✓</div>`;
  toast('Material atualizado com o novo preço.', 'ok');
  Orcamentos._ahUpdatePreview();
};

Orcamentos._ahAddAcessorio = function(){
  const acessorios = DB.all('acessorios');
  if(!acessorios.length){ toast('Cadastre acessórios primeiro (menu Acessórios).', 'err'); return; }
  Orcamentos._ahAcessorios.push({acessorioId:acessorios[0].id, quantidade:0});
  Orcamentos._ahRenderAcessorios();
  Orcamentos._ahUpdatePreview();
};
Orcamentos._ahRemoveAcessorio = function(idx){
  Orcamentos._ahAcessorios.splice(idx,1);
  Orcamentos._ahRenderAcessorios();
  Orcamentos._ahUpdatePreview();
};
Orcamentos._ahRenderAcessorios = function(){
  const acessorios = DB.all('acessorios');
  const el = document.getElementById('ah-acessorios-list');
  if(!Orcamentos._ahAcessorios.length){ el.innerHTML = `<div class="muted" style="font-size:12.5px;">Nenhum acessório adicionado.</div>`; return; }
  el.innerHTML = Orcamentos._ahAcessorios.map((a,idx)=>`
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
      <select style="flex:2;" class="f-input" onchange="Orcamentos._ahAcessorios[${idx}].acessorioId=this.value; Orcamentos._ahUpdatePreview();">
        ${acessorios.map(x=>`<option value="${x.id}" ${a.acessorioId===x.id?'selected':''}>${esc(x.nome)} (${fmtBRL(x.custoUnitario)})</option>`).join('')}
      </select>
      <input type="number" step="1" style="flex:1;" class="f-input" value="${a.quantidade}" onchange="Orcamentos._ahAcessorios[${idx}].quantidade=parseFloat(this.value)||0; Orcamentos._ahUpdatePreview();">
      <button type="button" class="btn sm ghost danger" onclick="Orcamentos._ahRemoveAcessorio(${idx})">&times;</button>
    </div>`).join('');
};

Orcamentos._ahSetMarkup = function(v){ document.getElementById('ah-markup').value = v; Orcamentos._ahUpdatePreview(); };

Orcamentos._ahCollectProduto = function(){
  const precoKgVal = document.getElementById('ah-precokg').value;
  const markupVal = parseFloat(document.getElementById('ah-markup').value)||1;
  return {
    nome: document.getElementById('ah-nome').value || 'Item sem nome',
    materialId: document.getElementById('ah-material').value,
    impressoraId: document.getElementById('ah-impressora').value,
    precoKgOverride: precoKgVal===''?null:parseFloat(precoKgVal),
    pesoLoteG: parseFloat(document.getElementById('ah-peso').value)||0,
    tempoLoteHoras: hhmmToDecimal(document.getElementById('ah-tempo').value),
    unidadesLote: parseFloat(document.getElementById('ah-unidades').value)||1,
    falhaPercent: (parseFloat(document.getElementById('ah-falha').value)||0)/100,
    unidadesMesEstimadas: parseFloat(document.getElementById('ah-unimes').value)||1,
    markupPadrao: markupVal, markupLojistaPadrao: markupVal,
    impostoOverride: (parseFloat(document.getElementById('ah-imposto').value)||0)/100,
    taxaCartaoOverride: (parseFloat(document.getElementById('ah-taxas').value)||0)/100,
    custoAnuncioOverride: 0,
    acessorios: Orcamentos._ahAcessorios,
    quantidadeMinima:1, obs:'Criado a partir de um orçamento (item calculado na hora).', status:'ativo'
  };
};

Orcamentos._ahUpdatePreview = function(){
  const produto = Orcamentos._ahCollectProduto();
  const material = DB.get('materiais', produto.materialId);
  const impressora = DB.get('impressoras', produto.impressoraId);
  const r = Calc.calcularProdutoCompleto({produto, material, impressora, acessoriosDb: DB.all('acessorios'), config: DB.data.config});

  document.getElementById('ah-preview').innerHTML = `

    <div class="calc-line"><span class="lbl">Custo de acessórios</span><span class="money">${fmtBRL(r.custoAcessorios)}</span></div>
    <div class="calc-line"><span class="lbl">Rateio de custo fixo + depreciação + falhas</span><span class="money">${fmtBRL(r.custoFixoRateio + r.custoDepreciacao + r.custoFalhas)}</span></div>
    <div class="calc-line total"><span class="lbl">Custo unitário (${produto.unidadesLote} peça(s)/lote)</span><span class="money">${fmtBRL(r.custoUnitario)}</span></div>
    <div class="hr"></div>
    <div class="calc-line"><span class="lbl">Preço de venda (markup ${fmtNum(r.markupConsumidor,2)}x)</span><span class="money pos">${fmtBRL(r.precoConsumidor)}</span></div>
    <div class="calc-line"><span class="lbl">Lucro líquido / margem</span><span class="money pos">${fmtBRL(r.lucroLiquidoConsumidor)} · ${fmtPct(r.margemConsumidor*100)}</span></div>
    <div class="hr"></div>
    <div class="calc-line"><span class="lbl">Quantidade do pedido</span><span class="num">${qtd}</span></div>
    <div class="calc-line total"><span class="lbl">Total deste item</span><span class="money">${fmtBRL(r.precoConsumidor*qtd)}</span></div>
  `;
};

Orcamentos.confirmarItemAdHoc = function(){
  const nome = document.getElementById('ah-nome').value.trim();
  if(!nome){ toast('Dê um nome para o item.', 'err'); return; }
  const produtoData = Orcamentos._ahCollectProduto();
  if(!produtoData.materialId){ toast('Selecione o material.', 'err'); return; }
  const material = DB.get('materiais', produtoData.materialId);
  const impressora = DB.get('impressoras', produtoData.impressoraId);
  const r = Calc.calcularProdutoCompleto({produto: produtoData, material, impressora, acessoriosDb: DB.all('acessorios'), config: DB.data.config});
  const qtd = parseFloat(document.getElementById('ah-qtdpedido').value)||1;

  let produtoId = null;
  if(document.getElementById('ah-salvarproduto').checked){
    const cliente = DB.get('clientes', Orcamentos._draft.clienteId);
    const novoProduto = Object.assign({id: uid(), codigo:'', descricao:'', clienteOrigemId: Orcamentos._draft.clienteId||null, clienteOrigemNome: cliente?cliente.nome:''}, produtoData);
    DB.upsert('produtos', novoProduto);
    produtoId = novoProduto.id;
  }

  const o = Orcamentos._draft;
  o.itens.push({
    id: uid(), produtoId: produtoId, produtoNome: nome, produtoCodigo:'',
    quantidade: qtd,
    custoUnitarioSnapshot: round2(r.custoUnitario),
    custoAcessoriosUnitarioSnapshot: round2(r.custoAcessoriosUnitario),
    markupSnapshot: r.markupConsumidor,
    precoUnitarioSnapshot: round2(r.precoConsumidor),
    impostoSnapshot: r.imposto, taxaCartaoSnapshot: r.taxaCartao, custoAnuncioSnapshot: r.custoAnuncio,
    impressoraIdSnapshot: produtoData.impressoraId||null,
    custoDepreciacaoUnitarioSnapshot: produtoData.unidadesLote>0 ? round2(r.custoDepreciacao/produtoData.unidadesLote) : 0
  });
  toast('Item calculado e adicionado ao orçamento.', 'ok');
  Orcamentos.abrirEditor();
};

/* ============================================================
   FINANCEIRO — compras de material, despesas gerais e fluxo de
   caixa real (baseado em pedidos FECHADOS x dinheiro gasto).
   Isso é separado do "lucro estimado" (modelo de custo por
   produto) mostrado em Orçamentos/Dashboard: aqui é o real.
   ============================================================ */
Views.financeiro = function(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="tabs" id="fin-tabs">
      <button class="active" data-t="fluxo">Fluxo de caixa</button>
      <button data-t="compras">Compras de material</button>
      <button data-t="despesas">Outras despesas</button>
    </div>
    <div id="fin-panel"></div>
  `;
  document.querySelectorAll('#fin-tabs button').forEach(b=>{
    b.onclick = ()=>{ document.querySelectorAll('#fin-tabs button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); Financeiro.renderPanel(b.dataset.t); };
  });
  Financeiro.renderPanel('fluxo');
};

const Financeiro = {
  mesAtual: todayISO().slice(0,7),

  renderPanel(tab){
    if(tab==='fluxo') Financeiro.renderFluxo();
    if(tab==='compras') Financeiro.renderCompras();
    if(tab==='despesas') Financeiro.renderDespesasGerais();
  },

  _mesLabel(ym){
    const [y,m] = ym.split('-');
    const nomes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    return `${nomes[parseInt(m,10)-1]} de ${y}`;
  },

  _dadosMes(ym){
    const orcs = DB.all('orcamentos').filter(o=>o.fechado && o.dataFechamento && o.dataFechamento.slice(0,7)===ym);
    const despesas = DB.all('despesas').filter(d=>d.data && d.data.slice(0,7)===ym);
    const despesasMaterial = despesas.filter(d=>d.tipo==='material');
    const despesasOperacionais = despesas.filter(d=>d.tipo!=='material');
    const receitas = orcs.reduce((s,o)=>s+(o.totais?.total||0),0);
    // custo de produção real: material (já com a margem de reajuste), energia, acessórios/insumos,
    // rateio de custo fixo, depreciação e falhas — tudo que compõe o.totais.custoTotal de cada pedido fechado
    const custoModelado = orcs.reduce((s,o)=>s+(o.totais?.custoTotal||0),0);
    const totalDespesasMaterial = despesasMaterial.reduce((s,d)=>s+(Number(d.valor)||0),0);
    const totalDespesasOperacionais = despesasOperacionais.reduce((s,d)=>s+(Number(d.valor)||0),0);
    const totalDespesas = totalDespesasMaterial + totalDespesasOperacionais;
    // saldo de caixa: visão de caixa pura — tudo que entrou menos tudo que saiu (inclui compras de estoque)
    const saldoCaixa = receitas - totalDespesas;
    // lucro real: receita menos o custo de produção efetivamente usado em cada pedido (material+energia+insumos+
    // depreciação+falhas) menos despesas operacionais gerais. Compras de material NÃO entram aqui de novo — elas
    // já estão embutidas no custo de produção de cada peça, para não contar o material em dobro.
    const lucroReal = receitas - custoModelado - totalDespesasOperacionais;
    return {orcs, despesas, despesasMaterial, despesasOperacionais, receitas, custoModelado,
      totalDespesas, totalDespesasMaterial, totalDespesasOperacionais, saldoCaixa, lucroReal};
  },

  renderFluxo(){
    const panel = document.getElementById('fin-panel');
    const ym = Financeiro.mesAtual;

      meses.push(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'));
    }
    const trend = meses.map(m=>({m, ...Financeiro._dadosMes(m)}));
    const maxV = Math.max(1, ...trend.map(t=>Math.max(t.receitas,t.custoModelado,t.totalDespesasOperacionais)));

    panel.innerHTML = `
      <div class="card card-pad" style="margin-bottom:16px;background:#F2F7FB;border-color:#C9DEEF;">
        <div class="flex-between" style="flex-wrap:wrap;gap:12px;">
          <div>
            <div class="section-title" style="margin-bottom:2px;">Saldo em caixa</div>
            <div class="section-sub" style="margin-bottom:0;">Atualiza sozinho quando um pedido é fechado (entrada) e quando você registra uma compra de material ou despesa (saída). Use "Corrigir saldo" só para conferir/ajustar manualmente, se precisar bater com o banco.</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:22px;font-weight:800;">${fmtBRL(DB.data.caixa?.saldo||0)}</div>
            <div class="muted" style="font-size:11px;">${DB.data.caixa?.atualizadoEm?('atualizado em '+fmtDateBR(DB.data.caixa.atualizadoEm)):'ainda não atualizado'}</div>
          </div>
          <button class="btn navy" onclick="Financeiro.abrirCaixaForm()">Corrigir saldo</button>
        </div>
      </div>

      <div class="toolbar">
        <button class="btn sm" onclick="Financeiro.mudarMes(-1)">&larr;</button>
        <div style="font-weight:800;font-size:14px;min-width:180px;text-align:center;text-transform:capitalize;">${Financeiro._mesLabel(ym)}</div>
        <button class="btn sm" onclick="Financeiro.mudarMes(1)">&rarr;</button>
        <div class="grow"></div>
        <button class="btn" onclick="Financeiro.mesAtual = todayISO().slice(0,7); Financeiro.renderFluxo();">Mês atual</button>
      </div>

      <div class="grid cols-4" style="margin-bottom:8px;">
        <div class="kpi accent"><div class="label">Receitas (pedidos fechados)</div><div class="value">${fmtBRL(d.receitas)}</div><div class="delta">${d.orcs.length} pedido(s) fechado(s)</div></div>
        <div class="kpi"><div class="label">Custo de produção dos pedidos</div><div class="value">${fmtBRL(d.custoModelado)}</div><div class="delta">material + energia + insumos + depreciação + falhas</div></div>
        <div class="kpi"><div class="label">Despesas operacionais</div><div class="value">${fmtBRL(d.totalDespesasOperacionais)}</div><div class="delta">${d.despesasOperacionais.length} lançamento(s) — não inclui compra de material</div></div>
        <div class="kpi" style="border-color:${d.lucroReal>=0?'rgba(28,156,107,.35)':'rgba(214,71,60,.35)'};">
          <div class="label">Lucro real do mês</div>
          <div class="value" style="color:${d.lucroReal>=0?'var(--green)':'var(--red)'};">${fmtBRL(d.lucroReal)}</div>
          <div class="delta">receita − custo de produção − despesas operacionais</div>
        </div>
      </div>
      <div class="grid cols-2" style="margin-bottom:18px;">
        <div class="kpi"><div class="label">Compras de material no mês (caixa)</div><div class="value">${fmtBRL(d.totalDespesasMaterial)}</div><div class="delta">${d.despesasMaterial.length} compra(s) — estoque, não é custo por pedido</div></div>
        <div class="kpi"><div class="label">Saldo de caixa do mês</div><div class="value" style="color:${d.saldoCaixa>=0?'var(--green)':'var(--red)'};">${fmtBRL(d.saldoCaixa)}</div><div class="delta">receita − todas as despesas (inclui compras de estoque)</div></div>
      </div>
      <div class="note-box blue" style="margin-bottom:18px;">
        <strong>Lucro real</strong> desconta o custo de produção de cada pedido fechado (material com a margem de reajuste, energia, insumos/acessórios, rateio de custo fixo, depreciação e falhas) — é a margem de verdade do que você vendeu.
        <strong style="margin-top:6px;">Saldo de caixa</strong> é a visão de dinheiro puro: tudo que entrou menos tudo que saiu, incluindo compras de material para estoque (mesmo que ainda não tenham sido usadas em nenhum pedido).
      </div>

      <div class="card card-pad" style="margin-bottom:16px;">
        <div class="section-title">Últimos 6 meses</div>
        <div style="display:flex;align-items:flex-end;gap:14px;height:140px;margin-top:14px;padding:0 4px;">
          ${trend.map(t=>`
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
              <div style="display:flex;align-items:flex-end;gap:3px;height:100px;">
                <div title="Receita ${fmtBRL(t.receitas)}" style="width:11px;border-radius:3px 3px 0 0;background:var(--orange);height:${Math.max(2,t.receitas/maxV*100)}px;"></div>
                <div title="Custo de produção ${fmtBRL(t.custoModelado)}" style="width:11px;border-radius:3px 3px 0 0;background:#8C99A6;height:${Math.max(2,t.custoModelado/maxV*100)}px;"></div>
                <div title="Despesas operacionais ${fmtBRL(t.totalDespesasOperacionais)}" style="width:11px;border-radius:3px 3px 0 0;background:#C9D2DB;height:${Math.max(2,t.totalDespesasOperacionais/maxV*100)}px;"></div>
              </div>
              <div style="font-size:10.5px;color:var(--ink-faint);text-transform:capitalize;">${t.m.slice(5)}/${t.m.slice(2,4)}</div>
            </div>

        </div>
        <div class="pill-row" style="margin-top:10px;font-size:11.5px;">
          <span><span style="display:inline-block;width:9px;height:9px;background:var(--orange);border-radius:2px;margin-right:5px;"></span>Receita</span>
          <span><span style="display:inline-block;width:9px;height:9px;background:#8C99A6;border-radius:2px;margin-right:5px;"></span>Custo de produção</span>
          <span><span style="display:inline-block;width:9px;height:9px;background:#C9D2DB;border-radius:2px;margin-right:5px;"></span>Despesas operacionais</span>
        </div>
      </div>

      <div class="grid cols-2">
        <div class="card card-pad">
          <div class="section-title">Pedidos fechados no mês</div>
          ${d.orcs.length ? `<div class="tbl-wrap" style="box-shadow:none;margin-top:8px;"><table class="tbl"><thead><tr><th>Nº</th><th>Cliente</th><th>Data</th><th>Valor</th></tr></thead><tbody>
            ${d.orcs.map(o=>{ const cli=DB.get('clientes',o.clienteId); return `<tr style="cursor:pointer;" onclick="Orcamentos.abrir('${o.id}')"><td class="num">#${o.numero}</td><td>${esc(cli?cli.nome:'—')}</td><td>${fmtDateBR(o.dataFechamento)}</td><td class="money">${fmtBRL(o.totais?.total||0)}</td></tr>`; }).join('')}
          </tbody></table></div>` : `<div class="tbl-empty">Nenhum pedido fechado neste mês.</div>`}
        </div>
        <div class="card card-pad">
          <div class="section-title">Despesas do mês</div>
          ${d.despesas.length ? `<div class="tbl-wrap" style="box-shadow:none;margin-top:8px;"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>
            ${d.despesas.map(x=>`<tr><td>${fmtDateBR(x.data)}</td><td>${esc(x.tipo==='material'?('Material: '+(DB.get('materiais',x.materialId)?.nome||'—')):x.descricao)}</td><td class="money">${fmtBRL(x.valor)}</td></tr>`).join('')}
          </tbody></table></div>` : `<div class="tbl-empty">Nenhuma despesa lançada neste mês.</div>`}
        </div>
      </div>
    `;
  },

  mudarMes(delta){
    const [y,m] = Financeiro.mesAtual.split('-').map(Number);
    const dt = new Date(y, m-1+delta, 1);
    Financeiro.mesAtual = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');
    Financeiro.renderFluxo();
  },

  renderCompras(){
    const panel = document.getElementById('fin-panel');
    const compras = DB.all('despesas').filter(d=>d.tipo==='material').sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    panel.innerHTML = `
      <div class="toolbar"><div class="grow"></div><button class="btn primary" onclick="Financeiro.abrirCompraForm()">+ Registrar compra de material</button></div>
      ${compras.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Material</th><th>Quantidade</th><th>Valor pago</th><th>Preço/kg</th><th>Fornecedor</th><th></th></tr></thead><tbody>
        ${compras.map(c=>{
          const mat = DB.get('materiais', c.materialId);
          const precoKg = c.quantidadeKg>0 ? c.valor/c.quantidadeKg : 0;
          return `<tr>
            <td>${fmtDateBR(c.data)}</td><td>${esc(mat?mat.nome:'— removido —')}</td>
            <td class="num">${fmtNum(c.quantidadeKg,2)} kg</td><td class="money">${fmtBRL(c.valor)}</td><td class="money">${fmtBRL(precoKg)}</td>
            <td>${esc(c.fornecedor)||'—'}</td>
            <td class="row-actions"><button class="btn sm danger ghost" onclick="Financeiro.excluirDespesa('${c.id}')">Excluir</button></td>
          </tr>`;
        }).join('')}
      </tbody></table></div>` : `<div class="card"><div class="empty-state"><div class="big">&#128230;</div><h4>Nenhuma compra registrada</h4><p>Toda vez que comprar filamento ou outra matéria-prima, registre aqui — o preço do material é atualizado automaticamente.</p><button class="btn primary" onclick="Financeiro.abrirCompraForm()">+ Registrar compra</button></div></div>`}
    `;
  },

  abrirCompraForm(){
    const materiais = DB.all('materiais');
    Modal.open(`
      <div class="modal-head"><h3>Registrar compra de material</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <form id="compra-form">
          <div class="form-grid">
            <div class="field span2"><label>Material <span class="req">*</span></label>
              <select required name="materialId" class="f-input">
                <option value="">Selecione...</option>
                ${materiais.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>Data da compra</label><input type="date" name="data" value="${todayISO()}"></div>
            <div class="field"><label>Fornecedor</label><input name="fornecedor"></div>
            <div class="field"><label>Quantidade comprada (kg) <span class="req">*</span></label><input required type="number" step="0.001" name="quantidadeKg" id="compra-qtd"></div>
            <div class="field"><label>Valor total pago (R$) <span class="req">*</span></label><input required type="number" step="0.01" name="valor" id="compra-valor"></div>
            <div class="field span2"><label>Preço por kg (calculado)</label><input readonly id="compra-precokg-view" value="R$ 0,00"></div>
            <div class="field span2"><label>Observações</label><textarea name="obs"></textarea></div>
          </div>
          <div class="field" style="margin-top:10px;"><label style="display:flex;align-items:center;gap:6px;font-weight:600;"><input type="checkbox" name="atualizarMaterial" checked style="width:14px;height:14px;">Atualizar o cadastro do material com este novo preço/kg</label></div>
        </form>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn primary" onclick="Financeiro.salvarCompra()">Registrar compra</button></div>
    `);
    ['compra-qtd','compra-valor'].forEach(id=>document.getElementById(id).addEventListener('input', ()=>{
      const q = parseFloat(document.getElementById('compra-qtd').value)||0;
      const v = parseFloat(document.getElementById('compra-valor').value)||0;
      document.getElementById('compra-precokg-view').value = fmtBRL(q>0?v/q:0);
    }));
  },

  salvarCompra(){
    const form = document.getElementById('compra-form');
    const fd = new FormData(form);
    const materialId = fd.get('materialId');
    const quantidadeKg = parseFloat(fd.get('quantidadeKg'))||0;
    const valor = parseFloat(fd.get('valor'))||0;
    if(!materialId || quantidadeKg<=0 || valor<=0){ toast('Preencha material, quantidade e valor.', 'err'); return; }
    const despesa = {
      id: uid(), tipo:'material', materialId, quantidadeKg, valor,
      data: fd.get('data')||todayISO(), fornecedor: fd.get('fornecedor')||'', obs: fd.get('obs')||''
    };
    DB.upsert('despesas', despesa);
    Financeiro.ajustarCaixa(-valor, `Compra de material`);
    if(fd.get('atualizarMaterial')){
      const mat = DB.get('materiais', materialId);
      if(mat){
        mat.precoRolo = valor; mat.pesoRolo = quantidadeKg; mat.custoKg = valor/quantidadeKg;
        mat.dataAtualizacaoPreco = despesa.data;
        mat.dataCompra = despesa.data; if(despesa.fornecedor) mat.fornecedor = despesa.fornecedor;
        DB.upsert('materiais', mat);
      }
    }
    Modal.close();
    toast('Compra registrada.', 'ok');
    Financeiro.renderCompras();
  },

  renderDespesasGerais(){
    const panel = document.getElementById('fin-panel');
    const despesas = DB.all('despesas').filter(d=>d.tipo!=='material').sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    panel.innerHTML = `
      <div class="toolbar"><div class="grow"></div><button class="btn primary" onclick="Financeiro.abrirDespesaForm()">+ Nova despesa</button></div>
      ${despesas.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th></th></tr></thead><tbody>
        ${despesas.map(d=>`<tr>
          <td>${fmtDateBR(d.data)}</td><td>${esc(d.categoria)||'—'}</td><td>${esc(d.descricao)}</td><td class="money">${fmtBRL(d.valor)}</td>
          <td class="row-actions"><button class="btn sm danger ghost" onclick="Financeiro.excluirDespesa('${d.id}')">Excluir</button></td>
        </tr>`).join('')}
      </tbody></table></div>` : `<div class="card"><div class="empty-state"><div class="big">&#128181;</div><h4>Nenhuma despesa cadastrada</h4><p>Aluguel, internet, softwares, manutenção — tudo que sai do caixa e não é compra de material.</p><button class="btn primary" onclick="Financeiro.abrirDespesaForm()">+ Nova despesa</button></div></div>`}
    `;
  },

  abrirDespesaForm(){
    Modal.open(`
      <div class="modal-head"><h3>Nova despesa</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <form id="despesa-form">
          <div class="form-grid">
            <div class="field span2"><label>Descrição <span class="req">*</span></label><input required name="descricao"></div>
            <div class="field"><label>Categoria</label><input name="categoria" placeholder="Aluguel, energia, software..."></div>
            <div class="field"><label>Data</label><input type="date" name="data" value="${todayISO()}"></div>
            <div class="field span2"><label>Valor (R$) <span class="req">*</span></label><input required type="number" step="0.01" name="valor"></div>
            <div class="field span2"><label>Observações</label><textarea name="obs"></textarea></div>
          </div>
        </form>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn primary" onclick="Financeiro.salvarDespesa()">Salvar despesa</button></div>
    `);
  },

  salvarDespesa(){
    const form = document.getElementById('despesa-form');
    const fd = new FormData(form);
    if(!fd.get('descricao') || !fd.get('valor')){ toast('Preencha descrição e valor.', 'err'); return; }
    const d = { id: uid(), tipo:'outro', descricao: fd.get('descricao'), categoria: fd.get('categoria')||'', data: fd.get('data')||todayISO(), valor: parseFloat(fd.get('valor'))||0, obs: fd.get('obs')||'' };
    DB.upsert('despesas', d);
    Financeiro.ajustarCaixa(-d.valor, `Despesa: ${d.descricao}`);
    Modal.close(); toast('Despesa registrada.', 'ok'); Financeiro.renderDespesasGerais();
  },

  excluirDespesa(id){
    confirmAction('Excluir este lançamento?', ()=>{
      const d = DB.get('despesas', id);
      if(d){ Financeiro.ajustarCaixa(Number(d.valor)||0, `Estorno: lançamento excluído`); }
      DB.remove('despesas', id);
      toast('Lançamento excluído.', 'ok');
      const activeTab = document.querySelector('#fin-tabs button.active')?.dataset.t || 'compras';
      Financeiro.renderPanel(activeTab);
    });
  },

  // ajusta o saldo em caixa automaticamente (delta positivo = entrada, negativo = saída)
  ajustarCaixa(delta, motivo){
    if(!DB.data.caixa) DB.data.caixa = { saldo: 0, atualizadoEm: null };
    DB.data.caixa.saldo = round2((DB.data.caixa.saldo||0) + delta);
    DB.data.caixa.atualizadoEm = todayISO();
    DB.save();
  },

  abrirCaixaForm(){
    const c = DB.data.caixa || {saldo:0, atualizadoEm:null};
    Modal.open(`
      <div class="modal-head"><h3>Corrigir saldo em caixa</h3><button onclick="Modal.close()">&times;</button></div>
      <div class="modal-body">
        <div class="field"><label>Saldo atual (R$)</label><input id="caixa-saldo" type="number" step="0.01" class="f-input" value="${c.saldo||0}"></div>
        <div class="note-box blue" style="margin-top:10px;">O saldo já é atualizado sozinho a cada pedido fechado, compra de material ou despesa. Use isto só para corrigir manualmente, caso o saldo real da conta/caixinha esteja diferente.</div>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancelar</button><button class="btn primary" onclick="Financeiro.salvarCaixa()">Salvar saldo</button></div>
    `);
  },
  salvarCaixa(){
    const saldo = parseFloat(document.getElementById('caixa-saldo').value)||0;
    DB.data.caixa = { saldo, atualizadoEm: todayISO() };
    DB.save();
    Modal.close();
    toast('Saldo em caixa atualizado.', 'ok');
    Financeiro.renderFluxo();
  }
};


/* ============================================================
   SINCRONIZAÇÃO EM NUVEM (Supabase — opcional)
   Sem nenhuma configuração, o sistema funciona exatamente como
   sempre (100% local). Quando configurado em Configurações ->
   Sincronização, os dados passam a ficar em tempo real entre
   todos os computadores conectados ao mesmo projeto Supabase.
   Modelo de dados: uma única tabela "addi3d_records" com colunas
   (workspace_id, collection, id, data jsonb, updated_at) — cada
   registro do sistema (cliente, produto, orçamento...) vira uma
   linha, guardando o JSON inteiro do registro em "data".
   ============================================================ */
const CLOUD_CFG_KEY = 'addi3d_cloud_cfg_v1';
const CLOUD_TABLE = 'addi3d_records';
const CLOUD_COLLECTIONS = ['clientes','materiais','impressoras','acessorios','produtos','orcamentos','despesas'];

const Cloud = {
  enabled: false,
  cfg: null,
  client: null,
  _channel: null,
  _loginResolve: null,

  loadCfg(){
    try{
      const raw = localStorage.getItem(CLOUD_CFG_KEY);
      this.cfg = raw ? JSON.parse(raw) : null;
    }catch(e){ this.cfg = null; }
    return this.cfg;
  },
  saveCfg(cfg){
    this.cfg = cfg;
    try{ localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify(cfg)); }catch(e){}
  },
  clearCfg(){
    this.cfg = null; this.enabled = false;
    if(this._channel){ try{ this.client.removeChannel(this._channel); }catch(e){} this._channel = null; }
    try{ localStorage.removeItem(CLOUD_CFG_KEY); }catch(e){}
  },

  wsId(){ return (this.cfg && this.cfg.workspaceId) || 'addi3d'; },

  _initClient(){
    try{
      if(!this.client){
        if(typeof supabase === 'undefined'){ console.error('Biblioteca do Supabase não carregou.'); return false; }
        this.client = supabase.createClient(this.cfg.supabaseUrl, this.cfg.supabaseAnonKey);
      }
      return true;
    }catch(e){ console.error('Supabase init falhou', e); return false; }
  },

  // Chamado no boot. Resolve quando o app pode prosseguir renderizando.
  bootCheck(){
    return new Promise((resolve)=>{
      this.loadCfg();
      if(!this.cfg || !this.cfg.supabaseUrl || !this.cfg.supabaseAnonKey || !this._initClient()){ resolve(); return; }
      this.client.auth.getSession().then(({data})=>{
        if(data && data.session){ Cloud._startSync().then(resolve); }
        else { Cloud._mostrarLogin(resolve); }
      }).catch(()=>{ Cloud._mostrarLogin(resolve); });
    });
  },

  _mostrarLogin(resolve){
    Cloud._loginResolve = resolve;
    const scrim = document.getElementById('cloud-login-scrim');
    const mark = document.getElementById('cloud-login-mark');
    mark.innerHTML = (typeof DEFAULT_LOGO_B64!=='undefined' && DEFAULT_LOGO_B64) ? `<img src="${DEFAULT_LOGO_B64}" style="width:100%;height:100%;object-fit:cover;">` : '';
    scrim.style.display = 'flex';
  },
  _esconderLogin(){ document.getElementById('cloud-login-scrim').style.display = 'none'; },

  tentarLogin(){
    const email = document.getElementById('cloud-login-email').value.trim();
    const senha = document.getElementById('cloud-login-senha').value;
    const erroEl = document.getElementById('cloud-login-erro');
    erroEl.textContent = '';
    if(!email || !senha){ erroEl.textContent = 'Preencha e-mail e senha.'; return; }
    this.client.auth.signInWithPassword({email, password: senha}).then(({error})=>{
      if(error){ erroEl.textContent = 'Não foi possível entrar. Confira e-mail e senha.'; return; }
      Cloud._esconderLogin();
      Cloud._startSync().then(()=>{ toast('Sincronização conectada.', 'ok'); Cloud._loginResolve && Cloud._loginResolve(); });
    }).catch(()=>{ erroEl.textContent = 'Não foi possível entrar. Confira e-mail e senha.'; });
  },

  usarSemNuvem(){
    Cloud._esconderLogin();
    Cloud._loginResolve && Cloud._loginResolve();
  },

  // Primeira conexão do workspace: decide entre subir os dados locais ou perguntar se baixa os da nuvem
  _startSync(){
    return this.client.from(CLOUD_TABLE).select('data,updated_at')
      .eq('workspace_id', this.wsId()).eq('collection','meta').eq('id','status')
      .maybeSingle().then(({data: row})=>{
        if(!row){
          return Cloud._pushAllLocalToCloud().then(()=>Cloud._attachListeners());
        }
        return new Promise((resolve)=>{
          const quando = row.updated_at ? fmtDateTimeBR(row.updated_at) : 'data desconhecida';
          Modal.open(`
            <div class="modal-head"><h3>Dados já existem na nuvem</h3></div>
            <div class="modal-body"><p>Última atualização na nuvem: <strong>${esc(quando)}</strong>. Deseja baixar esses dados agora para este computador? Isso substitui os dados salvos localmente aqui.</p></div>
            <div class="modal-foot">
              <button class="btn" id="cloud-skip-pull">Manter dados locais</button>
              <button class="btn primary" id="cloud-do-pull">Baixar dados da nuvem</button>
            </div>
          `);
          document.getElementById('cloud-skip-pull').onclick = ()=>{ Modal.close(); Cloud._attachListeners(); resolve(); };
          document.getElementById('cloud-do-pull').onclick = ()=>{
            Modal.close();
            Cloud._pullAllFromCloud().then(()=>{ Cloud._attachListeners(); resolve(); });
          };
        });
      });
  },

  // Envia TODO o estado local para a nuvem, substituindo o que já existir lá (usado na primeira
  // conexão e sempre que um backup é importado) — evita deixar registros "órfãos" na nuvem que
  // não existem mais localmente, e evita o problema de sobrescrever a tela com dados vazios.
  _pushAllLocalToCloud(){
    this.enabled = true;
    const ws = this.wsId();
    const rows = [];
    CLOUD_COLLECTIONS.forEach(col=>{
      DB.all(col).forEach(item=>{
        rows.push({ workspace_id: ws, collection: col, id: item.id, data: item, updated_at: nowISO() });
      });
    });
    rows.push({ workspace_id: ws, collection:'meta', id:'singletons', data:{ config: DB.data.config, caixa: DB.data.caixa, contador: DB.data.contador }, updated_at: nowISO() });
    rows.push({ workspace_id: ws, collection:'meta', id:'status', data:{}, updated_at: nowISO() });
    return this.client.from(CLOUD_TABLE).delete().eq('workspace_id', ws).then(({error: delErr})=>{
      if(delErr){ console.error('Cloud limpeza erro', delErr); toast('Falha ao preparar envio para a nuvem: ' + delErr.message, 'err'); return; }
      if(!rows.length){ return; }
      return this.client.from(CLOUD_TABLE).upsert(rows, {onConflict:'workspace_id,collection,id'}).then(({error})=>{
        if(error){ console.error('Cloud push inicial erro', error); toast('Falha ao enviar dados para a nuvem: ' + error.message, 'err'); return; }
        toast('Dados enviados para a nuvem.', 'ok');
      });
    });
  },

  _pullAllFromCloud(){
    const ws = this.wsId();
    return this.client.from(CLOUD_TABLE).select('collection,id,data').eq('workspace_id', ws).then(({data: rows, error})=>{
      if(error){ console.error('Cloud pull erro', error); toast('Falha ao baixar dados da nuvem: ' + error.message, 'err'); return; }
      CLOUD_COLLECTIONS.forEach(col=>{ DB.data[col] = []; });
      (rows||[]).forEach(r=>{
        if(CLOUD_COLLECTIONS.includes(r.collection)){ DB.data[r.collection].push(r.data); }
        else if(r.collection==='meta' && r.id==='singletons'){
          if(r.data.config) DB.data.config = r.data.config;
          if(r.data.caixa) DB.data.caixa = r.data.caixa;
          if(r.data.contador) DB.data.contador = r.data.contador;
        }
      });
      this.enabled = true;
      DB._localSave();
      App.applyBrand();
      Cloud._rerenderCurrent();
      toast('Dados baixados da nuvem.', 'ok');
    });
  },

  _attachListeners(){
    this.enabled = true;
    const ws = this.wsId();
    this._channel = this.client.channel('addi3d-sync-'+ws)
      .on('postgres_changes', {event:'*', schema:'public', table: CLOUD_TABLE, filter:`workspace_id=eq.${ws}`}, ()=>{
        Cloud._pullQuietly();
      })
      .subscribe();
  },

  // Igual ao _pullAllFromCloud, mas sem toasts (usado a cada evento em tempo real)
  _pullQuietly(){
    const ws = this.wsId();
    this.client.from(CLOUD_TABLE).select('collection,id,data').eq('workspace_id', ws).then(({data: rows, error})=>{
      if(error){ console.error('Cloud sync erro', error); return; }
      CLOUD_COLLECTIONS.forEach(col=>{ DB.data[col] = []; });
      (rows||[]).forEach(r=>{
        if(CLOUD_COLLECTIONS.includes(r.collection)){ DB.data[r.collection].push(r.data); }
        else if(r.collection==='meta' && r.id==='singletons'){
          if(r.data.config) DB.data.config = r.data.config;
          if(r.data.caixa) DB.data.caixa = r.data.caixa;
          if(r.data.contador) DB.data.contador = r.data.contador;
        }
      });
      DB._localSave();
      App.applyBrand();
      Cloud._rerenderCurrent();
    });
  },

  _rerenderCurrent(){
    if(document.getElementById('modal-scrim')?.classList.contains('open')) return; // evita fechar um formulário em andamento
    if(App.route) App.goto(App.route, App.routeParam);
  },

  // chamadas a partir de DB.upsert / DB.remove / DB.save (essas SÃO as únicas que devem gravar na nuvem)
  pushRecord(col, item){
    if(!this.enabled || !CLOUD_COLLECTIONS.includes(col)) return;
    this.client.from(CLOUD_TABLE).upsert(
      { workspace_id: this.wsId(), collection: col, id: item.id, data: item, updated_at: nowISO() },
      {onConflict:'workspace_id,collection,id'}
    ).then(({error})=>{ if(error) console.error('Cloud push erro', error); });
  },
  deleteRecord(col, id){
    if(!this.enabled || !CLOUD_COLLECTIONS.includes(col)) return;
    this.client.from(CLOUD_TABLE).delete()
      .eq('workspace_id', this.wsId()).eq('collection', col).eq('id', id)
      .then(({error})=>{ if(error) console.error('Cloud delete erro', error); });
  },
  pushSingletons(){
    if(!this.enabled) return;
    const ws = this.wsId();
    this.client.from(CLOUD_TABLE).upsert([
      { workspace_id: ws, collection:'meta', id:'singletons', data:{ config: DB.data.config, caixa: DB.data.caixa, contador: DB.data.contador }, updated_at: nowISO() },
      { workspace_id: ws, collection:'meta', id:'status', data:{}, updated_at: nowISO() }
    ], {onConflict:'workspace_id,collection,id'}).then(({error})=>{ if(error) console.error('Cloud push singletons erro', error); });
  },

  desconectar(){
    confirmAction('Desconectar a sincronização? Os dados deste computador continuam salvos localmente, mas param de sincronizar com a nuvem até reconectar.', ()=>{
      if(this._channel){ try{ this.client.removeChannel(this._channel); }catch(e){} this._channel = null; }
      this.enabled = false;
      if(this.client) this.client.auth.signOut().catch(()=>{});
      this.clearCfg();
      toast('Sincronização desconectada.', 'ok');
      App.goto('config');
    });
  }
};

</script>
</body>
